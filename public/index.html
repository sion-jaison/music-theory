Tasks.range = (el, p, done) => {
  function noMic() {
    el.innerHTML = `<p class="prompt">This step listens to your voice, so it needs the mic.</p><p class="fb info">${Mic.state === 'blocked' || Mic.state === 'unsupported' ? micProblem() : 'Turn on the mic to find your range, or skip it for now.'}</p><div class="row"><button type="button" class="btn primary" data-act="mic">Turn on mic</button><button type="button" class="btn" data-act="skip">Skip for now</button></div>`;
    el.querySelector('[data-act="mic"]').onclick = async () => { if (await Mic.start()) start(); else toast(micProblem()); };
    el.querySelector('[data-act="skip"]').onclick = () => done(true, { skipped: true });
  }
  let offP = null, lane = null;
  function start() {
    el.innerHTML = `<p class="prompt"></p><div class="lane-wrap"><canvas class="lane"></canvas></div><p class="fb info" aria-live="polite">Hold the note steady for about two seconds.</p>`;
    lane = PitchLane(el.querySelector('canvas'));
    const pr = el.querySelector('.prompt'), f = el.querySelector('.fb');
    let phase = 'low', samples = [], low = null;
    pr.textContent = 'Sing your lowest comfortable note on “ah” and hold it.';
    offP = Bus.on('pitch', q => {
      if (q.midiFloat == null || q.clarity < 0.9) { samples = []; return; }
      samples.push(q.midiFloat);
      if (samples.length > 3) {
        const med = samples.slice().sort((a, b) => a - b)[Math.floor(samples.length / 2)];
        samples = samples.filter(v => Math.abs(v - med) < 1);
      }
      if (samples.length >= 36) {
        const val = Math.round(mean(samples)); samples = [];
        if (phase === 'low') { low = val; phase = 'high'; pr.textContent = 'Now your highest comfortable note. No straining.'; fb(f, 'good', `Low note: ${noteName(low)}.`); }
        else {
          const lo = Math.min(low, val), hi = Math.max(low, val), span = hi - lo;
          const zl = lo + Math.round(span * 0.2), zh = hi - Math.round(span * 0.2);
          Store.data.range = { lo, hi, zl, zh }; Store.save();
          offP(); offP = null;
          pr.textContent = `Your range: ${noteName(lo)} to ${noteName(hi)}, ${span} half steps.`;
          fb(f, 'good', `Home zone: ${noteName(zl)} to ${noteName(zh)}. Singing tasks will stay inside it.`);
          done(true);
        }
      }
    });
  }
  if (Mic.state === 'on') start(); else noMic();
  return () => { if (offP) offP(); if (lane) lane.stop(); };
};

/* timing helpers for rhythm tasks */
function scheduleLights(lights, times, beatIdx) {
  const ids = [];
  times.forEach((t, i) => {
    const delay = Math.max(0, (t - Sound.now()) * 1000);
    ids.push(setTimeout(() => { lights.forEach(l => l.classList.remove('lit')); const L = lights[beatIdx(i)]; if (L) L.classList.add('lit'); }, delay));
  });
  return () => ids.forEach(clearTimeout);
}
function tapPadHTML() { return `<button type="button" class="tap-pad" data-act="tap">Tap here, press Space, or clap</button>`; }
function wireTapPad(el) {
  const b = el.querySelector('[data-act="tap"]'); if (!b) return;
  b.addEventListener('pointerdown', ev => { ev.preventDefault(); tap('tap'); });
}

Tasks.pulse = (el, p, done) => {
  const bpm = p.bpm || 80, spb = 60 / bpm, beats = 8;
  el.innerHTML = `<p class="prompt">Keep the beat at ${bpm} BPM for two bars, clapping a little louder on beat 1.</p><div class="beats"><span class="strong"></span><span></span><span></span><span></span></div>${tapPadHTML()}<div class="offsets" hidden></div><div class="row"><button type="button" class="btn primary" data-act="go">Start: four clicks, then you</button></div><p class="fb info" aria-live="polite">${Mic.state === 'on' ? 'With the mic on, the clicks stop after the count-in so the mic only hears you. Keep the beat with the light.' : 'Tap along with the clicks.'}</p>`;
  wireTapPad(el);
  const lights = [...el.querySelectorAll('.beats span')], go = el.querySelector('[data-act="go"]'), f = el.querySelector('.fb'), offs = el.querySelector('.offsets');
  let onsets = [], listening = false, cancelLights = null, endTimer = 0;
  const off = Bus.on('onset', d => { if (listening) onsets.push(d.t); });
  go.onclick = () => {
    const ctx = Sound.ensure(); if (!ctx) { fb(f, 'bad', 'This browser has no Web Audio, so the metronome can’t run.'); return; }
    go.disabled = true; offs.hidden = true; onsets = [];
    const t0 = ctx.currentTime + 0.35;
    const silent = Mic.state === 'on';
    const all = [];
    for (let i = 0; i < 4 + beats; i++) {
      const t = t0 + i * spb; all.push(t);
      if (i < 4 || !silent) Sound.click(t, i % 4 === 0, i >= 4);
    }
    const expected = all.slice(4);
    cancelLights = scheduleLights(lights, all, i => i % 4);
    fb(f, 'info', 'One, two, three, four…');
    setTimeout(() => { listening = true; fb(f, 'info', 'Your turn.'); }, Math.max(0, (t0 + 3.5 * spb - ctx.currentTime) * 1000));
    endTimer = setTimeout(() => {
      listening = false; lights.forEach(l => l.classList.remove('lit'));
      const used = new Set(); let hits = 0; const errs = [];
      const cells = expected.map(t => {
        let best = -1, bd = 1;
        onsets.forEach((o, k) => { if (!used.has(k) && Math.abs(o - t) < bd) { bd = Math.abs(o - t); best = k; } });
        if (best >= 0 && bd <= 0.15) { used.add(best); hits++; const e = (onsets[best] - t) * 1000; errs.push(Math.abs(e)); return e; }
        return null;
      });
      offs.hidden = false;
      offs.innerHTML = cells.map((e, i) => {
        if (e === null) return `<div><div class="bar"><i class="miss"></i></div>${i % 4 + 1}</div>`;
        const top = 50 - Math.max(-48, Math.min(48, e / 150 * 48));
        return `<div><div class="bar"><i class="${Math.abs(e) < 50 ? '' : (e < 0 ? 'early' : 'late')}" style="top:calc(${top}% - 3px)"></i></div>${i % 4 + 1}</div>`;
      }).join('');
      go.disabled = false; go.textContent = 'Go again';
      if (hits >= 6) { fb(f, 'good', `${hits} of 8 beats, ${Math.round(mean(errs))} ms off on average. Bars above the line were early, below were late.`); done(true, { hits }); }
      else fb(f, 'bad', `${hits} of 8 beats landed. Watch the light and try again: you need 6.`);
    }, Math.max(0, (expected[beats - 1] + 0.5 - ctx.currentTime) * 1000));
  };
  return () => { off(); if (cancelLights) cancelLights(); clearTimeout(endTimer); };
};

const PATTERNS = [[1, 1, 1, 1], [1, 1, 2], [0.5, 0.5, 1, 0.5, 0.5, 1], [1, -1, 1, 1], [2, 0.5, 0.5, 1], [4], [0.5, 0.5, 0.5, 0.5, 2]];
Tasks.clapback = (el, p, done) => {
  const list = [PATTERNS[0]].concat(shuffle(PATTERNS.slice(1)).slice(0, (p.rounds || 3) - 1));
  const spb = 60 / (p.bpm || 72);
  let r = 0, onsets = [], listening = false, timers = [];
  el.innerHTML = `<p class="prompt">Listen, then clap or tap the rhythm back.</p><div class="notation"></div><div class="beats"><span class="strong"></span><span></span><span></span><span></span></div>${tapPadHTML()}<div class="row"><button type="button" class="btn" data-act="hear">▶ Hear it</button><button type="button" class="btn primary" data-act="go">My turn</button><div class="progress-dots">${'<span></span>'.repeat(list.length)}</div></div><p class="fb info" aria-live="polite"></p>`;
  wireTapPad(el);
  const nota = el.querySelector('.notation'), f = el.querySelector('.fb'), dots = el.querySelectorAll('.progress-dots span'), lights = [...el.querySelectorAll('.beats span')];
  const hear = el.querySelector('[data-act="hear"]'), go = el.querySelector('[data-act="go"]');
  const off = Bus.on('onset', d => { if (listening) onsets.push(d.t); });
  const starts = pat => { const out = []; let b = 0; pat.forEach(d => { if (d > 0) out.push(b); b += Math.abs(d); }); return out; };
  const draw = marks => { nota.innerHTML = rhythmSVG(list[r], marks); };
  function clearT() { timers.forEach(clearTimeout); timers = []; }
  hear.onclick = () => {
    const ctx = Sound.ensure(); if (!ctx) return; clearT();
    const t0 = ctx.currentTime + 0.3;
    for (let i = 0; i < 4; i++) Sound.click(t0 + i * spb, i === 0, true);
    const bar = t0 + 4 * spb;
    starts(list[r]).forEach(b => Sound.wood(bar + b * spb));
    const times = []; for (let i = 0; i < 8; i++) times.push(t0 + i * spb);
    const cancel = scheduleLights(lights, times, i => i % 4); timers.push(setTimeout(() => { cancel(); lights.forEach(l => l.classList.remove('lit')); }, (8 * spb + 0.6) * 1000));
  };
  go.onclick = () => {
    const ctx = Sound.ensure(); if (!ctx) return; clearT();
    go.disabled = true; hear.disabled = true; onsets = [];
    const t0 = ctx.currentTime + 0.3;
    for (let i = 0; i < 4; i++) Sound.click(t0 + i * spb, i === 0, true);
    const bar = t0 + 4 * spb;
    const times = []; for (let i = 0; i < 8; i++) times.push(t0 + i * spb);
    scheduleLights(lights, times, i => i % 4);
    timers.push(setTimeout(() => { listening = true; fb(f, 'info', 'Your turn.'); }, (3.6 * spb + 0.3) * 1000));
    timers.push(setTimeout(() => {
      listening = false; lights.forEach(l => l.classList.remove('lit'));
      const exp = starts(list[r]).map(b => bar + b * spb);
      const used = new Set(); const marks = []; let matched = 0;
      exp.forEach(t => {
        let best = -1, bd = 1;
        onsets.forEach((o, k) => { if (!used.has(k) && Math.abs(o - t) < bd) { bd = Math.abs(o - t); best = k; } });
        if (best >= 0 && bd <= 0.14) { used.add(best); matched++; marks.push('ok'); } else marks.push('no');
      });
      const extra = onsets.filter((o, k) => !used.has(k) && o > bar - 0.15).length;
      const full = []; let mi = 0; list[r].forEach(d => full.push(d > 0 ? marks[mi++] : null));
      draw(full);
      go.disabled = false; hear.disabled = false;
      if (matched === exp.length && extra <= 1) {
        dots[r].classList.add('on'); r++;
        fb(f, 'good', 'Every note landed.');
        if (r >= list.length) { done(true); go.disabled = true; hear.disabled = true; }
        else timers.push(setTimeout(() => { draw(); fb(f, 'info', 'Next rhythm. Hear it first.'); }, 1600));
      } else fb(f, 'bad', `${matched} of ${exp.length} notes landed${extra > 1 ? `, plus ${extra} extra claps` : ''}. Red dots show the ones to fix. Hear it again, then retry.`);
    }, (8 * spb + 0.55) * 1000));
  };
  draw();
  return () => { off(); clearT(); };
};

function blackCall() {
  const L = BLACK_IN_RANGE.filter(m => m >= 54 && m <= 70);
  let i = randInt(1, L.length - 3); const out = [L[i]];
  while (out.length < 4) { i = Math.max(0, Math.min(L.length - 1, i + rand([-2, -1, 1, 1, 2]))); out.push(L[i]); }
  return out;
}
Tasks.echo = (el, p, done) => {
  let phase = 'echo', round = 0, call = blackCall(), got = [];
  el.innerHTML = `<p class="prompt"></p><div class="notes-strip"></div><div class="row">${playBtn('Hear the call')}<button type="button" class="btn small" data-act="clear">Start over</button></div><p class="fb info" aria-live="polite"></p><div class="row" data-save hidden><button type="button" class="btn primary small" data-act="save">Save this answer to my sketchbook</button></div>`;
  const pr = el.querySelector('.prompt'), strip = el.querySelector('.notes-strip'), f = el.querySelector('.fb'), saveRow = el.querySelector('[data-save]');
  const play = () => Sound.seq(call.map((m, i) => ({ m, t: i * 0.42, d: 0.38 })));
  const paint = () => { strip.innerHTML = got.length ? got.map(m => `<span class="n">${SHARP[mod12(m)]}</span>`).join('') : '<span class="empty">Your notes appear here</span>'; };
  const setPrompt = () => { pr.textContent = phase === 'echo' ? `Echo ${round + 1} of 2: play the call back, note for note, on black keys.` : 'Now answer it: four black-key notes of your own that are different from the call.'; };
  el.querySelector('[data-act="play"]').onclick = play;
  el.querySelector('[data-act="clear"]').onclick = () => { got = []; paint(); fb(f, 'info', ''); };
  el.querySelector('[data-act="save"]').onclick = () => {
    saveSketch({ name: 'Answer to a call', notes: got.map((m, i) => ({ m, t: i * 0.42 })), prompt: 'Echo and answer' });
    saveRow.hidden = true; fb(f, 'good', 'Saved to your sketchbook.');
  };
  const off = Bus.on('note', d => {
    if (phase === 'done') return;
    got.push(d.midi); paint();
    if (got.length < 4) return;
    const same = got.every((m, i) => mod12(m) === mod12(call[i]));
    if (phase === 'echo') {
      if (same) {
        round++; fb(f, 'good', 'Exact echo.');
        if (round >= 2) { phase = 'answer'; call = blackCall(); }
        else call = blackCall();
        got = []; setTimeout(() => { paint(); setPrompt(); play(); }, 1200);
      } else {
        strip.innerHTML = got.map((m, i) => `<span class="n${mod12(m) === mod12(call[i]) ? '' : ' off'}">${SHARP[mod12(m)]}</span>`).join('');
        fb(f, 'bad', 'Close. The red notes differ from the call. Hear it again and retry.'); got = [];
      }
    } else {
      const allBlack = got.every(isBlack);
      if (!allBlack) { fb(f, 'bad', 'Keep the answer on black keys so it fits the call.'); got = []; return; }
      if (same) { fb(f, 'bad', 'That repeats the call exactly. Change at least one note to make it yours.'); got = []; return; }
      phase = 'done';
      fb(f, 'good', 'That is your answer. Listen to the call and answer together.');
      Sound.seq(call.map((m, i) => ({ m, t: i * 0.42, d: 0.38 })).concat(got.map((m, i) => ({ m, t: 2 + i * 0.42, d: 0.38 }))));
      saveRow.hidden = false; done(true);
    }
  });
  paint(); setPrompt(); setTimeout(play, 300);
  return off;
};

Tasks.motif = (el, p, done) => {
  let notes = [], rec = false, tStart = 0;
  el.innerHTML = `<p class="prompt">${p.prompt}</p><div class="notes-strip"></div><div class="row"><button type="button" class="btn primary" data-act="rec">● Record</button><button type="button" class="btn" data-act="play" disabled>▶ Play back</button><button type="button" class="btn ghost" data-act="clear" disabled>Clear</button></div><div class="field"><label for="motif-name">Name it</label><input id="motif-name" type="text" maxlength="40" placeholder="e.g. Rain on the roof"></div><div class="row"><button type="button" class="btn primary" data-act="save" disabled>Save to sketchbook</button></div><p class="fb info" aria-live="polite">${p.blackOnly ? 'Black keys only. Any order sounds good.' : (p.rule || '')}</p>`;
  const strip = el.querySelector('.notes-strip'), f = el.querySelector('.fb');
  const bRec = el.querySelector('[data-act="rec"]'), bPlay = el.querySelector('[data-act="play"]'), bClear = el.querySelector('[data-act="clear"]'), bSave = el.querySelector('[data-act="save"]'), name = el.querySelector('#motif-name');
  const max = p.max || 8, min = p.min || 3;
  const paint = () => {
    strip.innerHTML = notes.length ? notes.map(n => `<span class="n">${SHARP[mod12(n.m)]}</span>`).join('') : '<span class="empty">Press Record, then play your notes</span>';
    bPlay.disabled = !notes.length; bClear.disabled = !notes.length; bSave.disabled = notes.length < min;
  };
  bRec.onclick = () => { rec = !rec; bRec.textContent = rec ? '■ Stop' : '● Record'; if (rec) { notes = []; tStart = 0; paint(); fb(f, 'info', 'Recording. Play up to ' + max + ' notes.'); } };
  bPlay.onclick = () => Sound.seq(notes.map(n => ({ m: n.m, t: n.t, d: 0.4 })));
  bClear.onclick = () => { notes = []; paint(); };
  bSave.onclick = () => {
    const s = saveSketch(Object.assign({ name: name.value.trim() || 'Motif ' + (Store.data.sketches.length + 1), notes, prompt: p.prompt, level: p.level }, p.extra || {}));
    fb(f, 'good', `Saved “${s.name}” to your sketchbook.`); bSave.disabled = true; done(true);
  };
  const off = Bus.on('note', d => {
    if (!rec) return;
    if (p.blackOnly && !isBlack(d.midi)) { fb(f, 'bad', `${noteName(d.midi)} is a white key. This motif uses black keys only.`); return; }
    if (p.pcs && p.pcs.indexOf(mod12(d.midi)) < 0) { fb(f, 'bad', `${noteName(d.midi)} is not in ${p.pcsLabel || 'this scale'}.`); return; }
    if (!notes.length) tStart = d.t || Sound.now();
    notes.push({ m: d.midi, t: Math.max(0, Math.min(8, (d.t || Sound.now()) - tStart)) });
    paint();
    if (notes.length >= max) { rec = false; bRec.textContent = '● Record'; fb(f, 'info', 'That is ' + max + ' notes. Play it back, name it, save it.'); }
  });
  paint();
  return off;
};

/* one multiple-choice question. Optional: p.html (a picture above the choices), p.play (a note list for Sound.seq, or a function) */
Tasks.choice = (el, p, done) => {
  el.innerHTML = `<p class="prompt">${p.q}</p>${p.html ? `<div class="q-art">${p.html}</div>` : ''}${p.play ? `<div class="row">${playBtn(p.playLabel || 'Hear it')}</div>` : ''}<div class="choices">${p.options.map((o, i) => `<button type="button" class="choice" data-i="${i}">${o}</button>`).join('')}</div><p class="fb info" aria-live="polite"></p>`;
  const pb = el.querySelector('[data-act="play"]');
  if (pb) { const play = () => (typeof p.play === 'function' ? p.play() : Sound.seq(p.play)); pb.onclick = play; if (p.autoplay !== false) setTimeout(play, 250); }
  const box = el.querySelector('.choices'), f = el.querySelector('.fb'); let answered = false;
  box.onclick = ev => {
    const b = ev.target.closest('.choice'); if (!b || answered) return;
    answered = true; const ok = +b.dataset.i === p.answer;
    b.classList.add(ok ? 'right' : 'wrong');
    box.querySelector(`[data-i="${p.answer}"]`).classList.add('right');
    fb(f, ok ? 'good' : 'bad', (typeof p.why === 'function' ? p.why(ok) : p.why) || (ok ? 'Right.' : 'Not this time.'));
    done(ok);
  };
  return () => {};
};

/* A reading card. Optional extras: play (note list, 'metronome' or a function), fret, rhythm, marks (pitch classes to glow on the dock),
   art (HTML or a function returning HTML, shown under the text), mount(el) for an interactive widget (returns a cleanup). */
Tasks.card = (el, step) => {
  const art = typeof step.art === 'function' ? step.art() : step.art;
  el.innerHTML = `<div class="body">${step.body}</div>${art ? `<div class="art">${art}</div>` : ''}${step.play ? `<div class="row">${playBtn(step.playLabel)}</div>` : ''}${step.fret ? `<div class="fret">${fretSVG()}</div>` : ''}${step.rhythm ? `<div class="notation">${rhythmSVG(step.rhythm)}</div>` : ''}${step.mount ? '<div class="widget"></div>' : ''}`;
  const b = el.querySelector('[data-act="play"]');
  if (b) b.onclick = () => { if (step.play === 'metronome') { const ctx = Sound.ensure(); if (!ctx) return; const t0 = ctx.currentTime + 0.1; for (let i = 0; i < 8; i++) Sound.click(t0 + i * 0.75, i % 4 === 0); } else if (typeof step.play === 'function') step.play(); else Sound.seq(step.play); };
  if (step.marks) Keyboard.markPcs(step.marks, 'hint');
  const off = step.mount ? step.mount(el.querySelector('.widget')) : null;
  return () => { if (typeof off === 'function') off(); Keyboard.clearMarks(); };
};

/* =================================================================
   Shared components for Levels 2–5
   Staff notation, the Circle of Fifths, chord input (keys, MIDI, mic),
   and three reusable tasks: quiz, playSeq, playChords.
   ================================================================= */

/* ---------- sound helpers ---------- */
Sound.chord = function (midis, when, dur, vel) {
  if (!this.ensure()) return 0;
  const t0 = when == null ? this.now() + 0.05 : when;
  midis.forEach((m, i) => this.tone(m, t0 + i * 0.015, dur || 1.2, vel || 0.55));
  return t0 + (dur || 1.2);
};
/* chords: [{ sym, t, d }] → plays each chord voiced from octave 3 (or `oct`); returns duration in ms */
function playChordList(chords, oct) {
  const notes = [];
  chords.forEach(c => {
    const pc = Theory.parseChord(c.sym);
    let ms = Theory.voicing(pc.root, pc.q, oct == null ? 3 : oct);
    if (pc.bass) { const b = Theory.pc(pc.bass); while (mod12(ms[0]) !== b) { ms.push(ms.shift() + 12); } }
    ms.forEach((m, i) => notes.push({ m, t: c.t + i * 0.015, d: c.d || 0.9, v: 0.55 }));
  });
  return Sound.seq(notes);
}
const midiOf = n => Theory.midi(n);
/* play a sketch: its melody plus, if it has them, its chords underneath */
function playSketch(s) {
  const notes = (s.notes || []).map(n => ({ m: n.m, t: n.t, d: n.d || 0.4 }));
  (s.chords || []).forEach(c => {
    try { Theory.voicing(Theory.parseChord(c.sym).root, Theory.parseChord(c.sym).q, 3).forEach(m => notes.push({ m, t: c.t, d: c.d || 1, v: 0.4 })); } catch (e) { /* skip unknown symbols */ }
  });
  return Sound.seq(notes);
}

/* ---------- staff notation ----------
   Staff.svg({ clef: 'treble'|'bass'|'grand', notes, keySig, time, labels, marks, gap, filled, aria })
   notes: 'C4' | ['C4','E4','G4'] (a chord) | null (empty slot) | { n: 'C4' or [...], label, mark, staff }
   keySig: signed count (+ sharps, − flats). time: [3, 4]. marks: 'ok' | 'no' | 'target' per note. */
const Staff = (function () {
  const GAP = 10, HALF = GAP / 2;
  const step = n => { const p = Theory.parse(n); return p.L + 7 * p.oct; };
  const CLEFS = {
    treble: { bottom: 30, glyph: '𝄞', size: 40.6, dy: 40.5, sharps: ['F5', 'C5', 'G5', 'D5', 'A4', 'E5', 'B4'], flats: ['B4', 'E5', 'A4', 'D5', 'G4', 'C5', 'F4'] },
    bass: { bottom: 18, glyph: '𝄢', size: 45.4, dy: 40.4, sharps: ['F3', 'C3', 'G3', 'D3', 'A2', 'E3', 'B2'], flats: ['B2', 'E3', 'A2', 'D3', 'G2', 'C3', 'F2'] }
  };
  const ACC_GLYPH = { '-2': '𝄫', '-1': '♭', '0': '♮', '1': '♯', '2': '𝄪' };
  function norm(item) {
    if (item == null) return { ns: [] };
    if (typeof item === 'string' || Array.isArray(item)) return { ns: [].concat(item) };
    return { ns: [].concat(item.n || []), label: item.label, mark: item.mark, staff: item.staff, acc: item.acc };
  }
  function svg(o) {
    o = o || {};
    const clef = o.clef || 'treble', grand = clef === 'grand';
    const items = (o.notes || []).map(norm);
    items.forEach(it => { it.staff = it.staff || (grand ? (it.ns.length && step(it.ns[0]) >= 28 ? 'treble' : 'bass') : clef); });
    const staves = grand ? ['treble', 'bass'] : [clef];
    /* vertical room for ledger lines above and below */
    const ext = {};
    staves.forEach(k => {
      const c = CLEFS[k], top = c.bottom + 8;
      let hi = top, lo = c.bottom;
      items.forEach(it => { if (it.staff !== k) return; it.ns.forEach(n => { const s = step(n); hi = Math.max(hi, s); lo = Math.min(lo, s); }); });
      ext[k] = { above: (hi - top) * HALF + 14, below: (c.bottom - lo) * HALF + 14 };
    });
    const y0 = {};
    let y = 12 + Math.max(16, ext[staves[0]].above);
    y0[staves[0]] = y;
    if (grand) y0.bass = y + 4 * GAP + Math.max(50, ext.treble.below + ext.bass.above);
    const lastStaff = staves[staves.length - 1];
    const labelsY = y0[lastStaff] + 4 * GAP + Math.max(16, ext[lastStaff].below) + 14;
    const H = labelsY + (items.some(it => it.label) || o.labels ? 10 : -4);
    const yOf = (k, s) => y0[k] + 4 * GAP - (s - CLEFS[k].bottom) * HALF;

    const ks = o.keySig || 0, nAcc = Math.abs(ks);
    const xKey = 48, xTime = xKey + nAcc * 11 + (nAcc ? 4 : 0), xNotes = xTime + (o.time ? 30 : 4) + 18;
    const gap = o.gap || 48;
    const W = Math.max(o.minWidth || 0, xNotes + Math.max(1, items.length) * gap);
    let out = '';
    staves.forEach(k => {
      const c = CLEFS[k];
      for (let i = 0; i < 5; i++) out += `<line class="sl" x1="4" x2="${W - 4}" y1="${y0[k] + i * GAP}" y2="${y0[k] + i * GAP}"/>`;
      out += `<text class="clef" x="8" y="${y0[k] + c.dy}" font-size="${c.size}">${c.glyph}</text>`;
      const list = ks > 0 ? c.sharps : c.flats;
      for (let i = 0; i < nAcc; i++) out += `<text class="acc" x="${xKey + i * 11}" y="${yOf(k, step(list[i])) + 5}" text-anchor="middle">${ks > 0 ? '♯' : '♭'}</text>`;
      if (o.time) out += `<text class="tsig" x="${xTime + 10}" y="${y0[k] + 18}" text-anchor="middle">${o.time[0]}</text><text class="tsig" x="${xTime + 10}" y="${y0[k] + 38}" text-anchor="middle">${o.time[1]}</text>`;
    });
    if (grand) out += `<line class="sl" x1="4" x2="4" y1="${y0.treble}" y2="${y0.bass + 4 * GAP}"/>`;
    items.forEach((it, i) => {
      const x = xNotes + i * gap + gap / 2 - 10;
      const k = it.staff, c = CLEFS[k], top = c.bottom + 8;
      const mark = it.mark || (o.marks && o.marks[i]) || '';
      const steps = it.ns.map(step).sort((a, b) => a - b);
      if (steps.length) {
        const lo = steps[0], hi = steps[steps.length - 1];
        for (let s = c.bottom - 2; s >= lo; s -= 2) out += `<line class="sl ledger" x1="${x - 11}" x2="${x + 11}" y1="${yOf(k, s)}" y2="${yOf(k, s)}"/>`;
        for (let s = top + 2; s <= hi; s += 2) out += `<line class="sl ledger" x1="${x - 11}" x2="${x + 11}" y1="${yOf(k, s)}" y2="${yOf(k, s)}"/>`;
      }
      let prev = -99, shift = 0;
      it.ns.slice().sort((a, b) => step(a) - step(b)).forEach(n => {
        const s = step(n), yy = yOf(k, s);
        shift = (s - prev === 1 && !shift) ? 12 : 0; prev = s;
        const p = Theory.parse(n);
        const show = it.acc === false ? false : (p.acc !== 0 || it.acc === 'natural');
        if (show) out += `<text class="acc" x="${x - 15}" y="${yy + 5}" text-anchor="middle">${ACC_GLYPH[p.acc]}</text>`;
        out += o.filled
          ? `<ellipse class="head filled ${mark}" cx="${x + shift}" cy="${yy}" rx="6" ry="4.4" transform="rotate(-20 ${x + shift} ${yy})"/>`
          : `<ellipse class="head ${mark}" cx="${x + shift}" cy="${yy}" rx="6.4" ry="4.4" transform="rotate(-20 ${x + shift} ${yy})"/>`;
      });
      if (o.filled && steps.length) {
        const mid = c.bottom + 4, upStem = steps[0] < mid;
        const yy = upStem ? yOf(k, steps[steps.length - 1]) : yOf(k, steps[0]);
        out += upStem ? `<line class="stem" x1="${x + 5.6}" x2="${x + 5.6}" y1="${yOf(k, steps[0]) - 1}" y2="${yy - 34}"/>` : `<line class="stem" x1="${x - 5.6}" x2="${x - 5.6}" y1="${yOf(k, steps[steps.length - 1]) + 1}" y2="${yy + 34}"/>`;
      }
      const label = it.label != null ? it.label : (o.labels ? o.labels[i] : null);
      if (label != null) out += `<text class="nlabel ${mark}" x="${x}" y="${labelsY}" text-anchor="middle">${label}</text>`;
    });
    const aria = o.aria || (clef + ' staff' + (items.length ? ': ' + items.map(it => it.ns.join(' ')).join(', ') : ''));
    return `<svg class="nstaff" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="${esc(aria)}">${out}</svg>`;
  }
  return { svg, step };
})();

/* ---------- the Circle of Fifths ----------
   Circle.svg({ selected, family, hide, reveal, marks, ring, center })
   selected: clock position 0–11 (C = 0, G = 1 …). family: light the six chords of the selected key.
   hide: hide the labels (fill-the-clock), reveal: positions to show anyway. marks: { pos: 'ok'|'no' }. */
const Circle = (function () {
  const C = 180, R1 = 176, R2 = 122, R3 = 74;
  const rad = d => d * Math.PI / 180;
  const pt = (r, deg) => [C + r * Math.cos(rad(deg)), C + r * Math.sin(rad(deg))].map(v => v.toFixed(1));
  function wedge(i, rin, rout) {
    const a0 = -90 + 30 * i - 15, a1 = a0 + 30;
    const [x0, y0] = pt(rout, a0), [x1, y1] = pt(rout, a1), [x2, y2] = pt(rin, a1), [x3, y3] = pt(rin, a0);
    return `M${x0} ${y0}A${rout} ${rout} 0 0 1 ${x1} ${y1}L${x2} ${y2}A${rin} ${rin} 0 0 0 ${x3} ${y3}Z`;
  }
  function sigText(i) {
    if (i === 0) return 'no ♯ or ♭';
    if (i === 6) return '6♯ / 6♭';
    const n = Theory.keySig(Theory.CIRCLE[i]).n;
    return n > 0 ? n + '♯' : (-n) + '♭';
  }
  const FAMILY = { major: { '-1': 'IV', '0': 'I', '1': 'V' }, minor: { '-1': 'ii', '0': 'vi', '1': 'iii' } };
  function role(ring, i, sel) {
    if (sel == null) return null;
    let d = ((i - sel) % 12 + 12) % 12; if (d === 11) d = -1;
    return FAMILY[ring][d] || null;
  }
  function svg(o) {
    o = o || {};
    const sel = o.selected == null ? null : o.selected;
    const shown = i => !o.hide || (o.reveal && o.reveal.indexOf(i) >= 0);
    let out = '';
    for (let i = 0; i < 12; i++) {
      const a = -90 + 30 * i;
      ['major', 'minor'].forEach(ring => {
        if (ring === 'minor' && o.ring === 'major') return;
        const fam = o.family ? role(ring, i, sel) : null;
        const mk = o.marks && o.marks[ring === 'major' ? i : 'm' + i];
        const cls = `wedge ${ring}${sel === i && (ring === 'major' || o.family) ? ' sel' : ''}${fam ? ' fam' : ''}${mk ? ' ' + mk : ''}`;
        const r0 = ring === 'major' ? R2 : R3, r1 = ring === 'major' ? R1 : R2;
        const name = ring === 'major' ? Theory.CIRCLE[i] : Theory.CIRCLE_MINOR[i] + 'm';
        const alt = Theory.CIRCLE_ALT[i];
        let label = '';
        if (shown(i)) {
          if (ring === 'major') {
            const [x, y] = pt((R1 + R2) / 2 + 6, a);
            label = `<text class="kname" x="${x}" y="${(+y + 2).toFixed(1)}" text-anchor="middle">${name}</text>`;
            if (alt) label += `<text class="kalt" x="${x}" y="${(+y + 15).toFixed(1)}" text-anchor="middle">${alt.major}</text>`;
            if (o.sigs !== false && !fam) { const [sx, sy] = pt(R2 + 12, a); label += `<text class="ksig" x="${sx}" y="${(+sy + 3).toFixed(1)}" text-anchor="middle">${sigText(i)}</text>`; }
          } else {
            const [x, y] = pt((R2 + R3) / 2 + 4, a);
            label = `<text class="mname" x="${x}" y="${(+y + 4).toFixed(1)}" text-anchor="middle">${name}</text>`;
          }
        }
        if (fam) { const [fx, fy] = pt(ring === 'major' ? R2 + 12 : R3 + 8, a); label += `<text class="froman" x="${fx}" y="${(+fy + 4).toFixed(1)}" text-anchor="middle">${fam}</text>`; }
        out += `<g class="${cls}" data-pos="${i}" data-ring="${ring}" tabindex="${o.static ? -1 : 0}" role="${o.static ? 'img' : 'button'}" aria-label="${shown(i) ? (ring === 'major' ? Theory.CIRCLE[i] + ' major, ' + sigText(i) : Theory.CIRCLE_MINOR[i] + ' minor') : 'hidden key at ' + (i || 12) + ' o’clock'}"><path d="${wedge(i, r0, r1)}"/>${label}</g>`;
      });
    }
    let center = o.center;
    if (center == null) center = sel == null ? ['Tap a key'] : [Theory.CIRCLE[sel] + ' major', sigText(sel), Theory.CIRCLE_MINOR[sel] + ' minor'];
    const cy = C - (center.length - 1) * 9;
    out += `<circle class="hub" cx="${C}" cy="${C}" r="${R3 - 6}"/>` + center.map((t, k) => `<text class="hubtxt${k ? ' sub' : ''}" x="${C}" y="${cy + k * 19 + 5}" text-anchor="middle">${t}</text>`).join('');
    return `<svg class="circle5" viewBox="0 0 360 360" role="group" aria-label="Circle of Fifths">${out}</svg>`;
  }
  /* interactive: onPick(pos, ring) on click or Enter */
  function mount(el, o, onPick) {
    o = Object.assign({}, o);
    el.innerHTML = svg(o);
    const pick = ev => { const w = ev.target.closest('[data-pos]'); if (w && onPick) onPick(+w.dataset.pos, w.dataset.ring); };
    const key = ev => { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); pick(ev); } };
    el.addEventListener('click', pick); el.addEventListener('keydown', key);
    return {
      update(n) { Object.assign(o, n); el.innerHTML = svg(o); },
      get opts() { return o; },
      destroy() { el.removeEventListener('click', pick); el.removeEventListener('keydown', key); }
    };
  }
  return { svg, mount, sigText };
})();

/* ---------- chord input ----------
   Emits Bus 'chord' events: { source, pcs, bassPc, rootPc, q, sym, inversion }.
   Keys and on-screen taps: notes played within WINDOW seconds form a chord.
   MIDI: held notes form a chord. Mic: chroma analysis (Mic.wantChords). */
const ChordIn = {
  users: 0, recent: [], held: new Set(), offs: [], WINDOW: 1.6,
  start() {
    if (this.users++ > 0) return;
    this.offs = [Bus.on('note', d => this.note(d)), Bus.on('noteoff', d => { if (d.source === 'midi') this.held.delete(d.midi); })];
    Mic.wantChords(true);
  },
  stop() {
    if (this.users === 0 || --this.users > 0) return;
    this.offs.forEach(f => f()); this.offs = []; this.recent = []; this.held.clear();
    Mic.wantChords(false);
  },
  clear() { this.recent = []; },
  note(d) {
    if (d.source === 'mic') return;
    const t = performance.now() / 1000;
    if (d.source === 'midi') this.held.add(d.midi);
    this.recent = this.recent.filter(n => t - n.t < this.WINDOW).concat([{ m: d.midi, t }]);
    const pool = d.source === 'midi' && this.held.size >= 3 ? [...this.held] : this.recent.map(n => n.m);
    /* try the whole window, then the last 4 and last 3 notes, so one wrong note does not block the chord */
    const tries = [pool, pool.slice(-4), pool.slice(-3)];
    let best = null, ms = pool;
    for (const cand of tries) {
      const pcs = [...new Set(cand.map(mod12))];
      if (pcs.length < 3) continue;
      const bass = Math.min.apply(null, cand);
      const id = Theory.identify(pcs, mod12(bass))[0];
      if (id) { best = id; ms = cand; break; }
    }
    const pcs = [...new Set(ms.map(mod12))].sort((a, b) => a - b);
    if (pcs.length < 3) return;
    Bus.emit('chord', chordEvent(d.source, pcs, mod12(Math.min.apply(null, ms)), best ? best.rootPc : null, best ? best.q : null));
  }
};
function chordEvent(source, pcs, bassPc, rootPc, q) {
  let sym = null, inversion = 0;
  if (q) {
    const root = Theory.rootName(rootPc, q);
    const shape = Theory.chordPcs(root, q);
    inversion = Math.max(0, shape.indexOf(bassPc));
    sym = Theory.symbol(root, q) + (inversion ? '/' + Theory.pcName(bassPc, Theory.accOf(root) < 0 || q === 'min') : '');
  }
  return { source, pcs, bassPc, rootPc, q, sym, inversion };
}
/* target: a symbol ('Am', 'C/E') or { root, q, bass } → comparable form */
function chordTarget(t) {
  const c = typeof t === 'string' ? Theory.parseChord(t) : t;
  return { root: c.root, q: c.q, rootPc: Theory.pc(c.root), pcs: Theory.chordPcs(c.root, c.q).sort((a, b) => a - b), bassPc: c.bass ? Theory.pc(c.bass) : null, sym: Theory.symbol(c.root, c.q, c.bass), notes: Theory.chordNotes(c.root, c.q) };
}
const sameSet = (a, b) => a.length === b.length && a.slice().sort((x, y) => x - y).every((v, i) => v === b.slice().sort((x, y) => x - y)[i]);
/* did this chord event play the target? Compares pitch-class sets, so C+ = E+ and Csus2 = Gsus4 count as the same chord */
function chordHit(ev, T) {
  let pcs = ev.pcs;
  if (ev.source === 'mic') { if (ev.q == null) return false; pcs = Theory.chordPcs(Theory.rootName(ev.rootPc, ev.q), ev.q); }
  return sameSet(pcs, T.pcs) && (T.bassPc == null || ev.bassPc === T.bassPc);
}
const chordWords = ev => ev.sym ? `${Theory.pretty(ev.sym)}${ev.q ? ' (' + Theory.CHORDS[ev.q].name + ')' : ''}` : ev.pcs.map(p => Theory.pcName(p)).join(' ');

/* live bars of the 12 pitch classes the mic hears; returns a cleanup */
function chromaMeter(el) {
  el.innerHTML = `<div class="chroma" aria-hidden="true">${Theory.SHARP_NAMES.map(n => `<div><i></i><span>${n}</span></div>`).join('')}</div>`;
  const bars = [...el.querySelectorAll('.chroma i')];
  return Bus.on('chroma', a => { bars.forEach((b, k) => { b.style.transform = `scaleY(${a ? Math.max(0.02, a.chroma[k]) : 0.02})`; }); });
}

/* ---------- reusable tasks ---------- */

/* A run of multiple-choice questions.
   p: { rounds, pass (0 = always completes), gen(i) → { q, html, options, answer, why, play, autoplay }, onAnswer(ok, item) } */
Tasks.quiz = (el, p, done) => {
  const rounds = p.rounds || 5, pass = p.pass || 0;
  let r = 0, score = 0, timer = 0, inner = null;
  el.innerHTML = `${p.prompt ? `<p class="lead">${p.prompt}</p>` : ''}<div class="progress-dots">${'<span></span>'.repeat(rounds)}</div><div class="quiz-q"></div><div class="row" data-retry hidden><button type="button" class="btn small" data-act="retry">Try again</button></div>`;
  const dots = el.querySelectorAll('.progress-dots span'), host = el.querySelector('.quiz-q'), retry = el.querySelector('[data-retry]');
  function next() {
    if (inner) inner();
    if (r >= rounds) {
      if (score >= pass) { host.insertAdjacentHTML('beforeend', `<p class="fb good">${score} of ${rounds}.${p.passMsg ? ' ' + p.passMsg : ''}</p>`); done(true, { score }); }
      else { host.insertAdjacentHTML('beforeend', `<p class="fb bad">${score} of ${rounds}. You need ${pass}.</p>`); retry.hidden = false; }
      return;
    }
    const item = p.gen(r);
    inner = Tasks.choice(host, item, ok => {
      dots[r].classList.add(ok ? 'on' : 'miss'); if (ok) score++;
      if (p.onAnswer) p.onAnswer(ok, item);
      r++; timer = setTimeout(next, ok ? 1100 : 2200);
    });
  }
  el.querySelector('[data-act="retry"]').onclick = () => { r = 0; score = 0; retry.hidden = true; dots.forEach(d => { d.className = ''; }); next(); };
  next();
  return () => { clearTimeout(timer); if (inner) inner(); };
};

/* Play notes in order (a scale, an arpeggio, a melody).
   p: { prompt, notes: ['C4', …], anyOctave (default true), show: 'names'|'hidden'|'degrees'|'solfege', steps (show W/H as you go),
        art (HTML above), hint(i, want) → text, endText, mark (glow the next key on the dock) }
   done(true, { misses }) */
Tasks.playSeq = (el, p, done) => {
  const notes = p.notes, any = p.anyOctave !== false, show = p.show || 'names';
  let i = 0, misses = 0, finished = false;
  const label = (n, k) => show === 'degrees' ? String(k % 7 + 1) : show === 'solfege' ? Theory.SOLFEGE[k % 7] : Theory.stripOct(n);
  const chip = (n, k) => `<span class="n${show === 'hidden' ? ' hid' : ''}" data-k="${k}">${show === 'hidden' ? '?' : label(n, k)}</span>`;
  const stepOf = k => k > 0 ? Theory.stepName(Math.abs(Theory.midi(notes[k]) - Theory.midi(notes[k - 1]))) : '';
  el.innerHTML = `${p.prompt ? `<p class="prompt">${p.prompt}</p>` : ''}${p.art ? `<div class="art">${p.art}</div>` : ''}<div class="notes-strip seq">${notes.map((n, k) => (p.steps && k ? `<span class="stp" data-s="${k}"></span>` : '') + chip(n, k)).join('')}</div><p class="fb info" aria-live="polite">${p.start || ''}</p>`;
  const f = el.querySelector('.fb');
  const chips = [...el.querySelectorAll('.notes-strip .n')];
  const markNext = () => { if (!p.mark) return; Keyboard.clearMarks(); if (i < notes.length) Keyboard.markPcs([Theory.pc(notes[i])], 'target'); };
  const hit = m => any ? mod12(m) === Theory.pc(notes[i]) : m === Theory.midi(notes[i]);
  chips.forEach((c, k) => c.classList.toggle('cur', k === 0));
  markNext();
  const off = Bus.on('note', d => {
    if (finished) return;
    if (hit(d.midi)) {
      const c = chips[i]; c.classList.remove('hid', 'cur'); c.classList.add('ok'); c.textContent = label(notes[i], i);
      if (p.steps && i > 0) { const s = el.querySelector(`[data-s="${i}"]`); if (s) { s.textContent = stepOf(i); s.classList.add('on'); } }
      i++;
      if (chips[i]) chips[i].classList.add('cur');
      markNext();
      if (i >= notes.length) { finished = true; Keyboard.clearMarks(); fb(f, 'good', p.endText || 'All the way through.'); done(true, { misses }); }
      else fb(f, 'good', p.progress ? p.progress(i) : `${i} of ${notes.length}`);
    } else if (i > 0 && (any ? mod12(d.midi) === Theory.pc(notes[i - 1]) : d.midi === Theory.midi(notes[i - 1]))) {
      /* repeating the last right note is not a mistake */
    } else {
      misses++;
      fb(f, 'bad', `That is ${noteName(d.midi)}. ${p.hint ? p.hint(i, notes[i]) : (p.steps && i > 0 ? `Next is a ${stepOf(i) === 'H' ? 'half' : 'whole'} step ${Theory.midi(notes[i]) > Theory.midi(notes[i - 1]) ? 'up' : 'down'} from ${Theory.stripOct(notes[i - 1])}.` : 'Try again.')}`);
    }
  });
  return () => { off(); Keyboard.clearMarks(); };
};

/* Play named chords, one after another, on any instrument.
   p: { prompt, chords: ['C', 'Am', 'G7', 'C/E', …], labels (shown instead of the names, e.g. Roman numerals), tones (show the notes as a hint),
        limit (seconds per chord), pass (how many must land, default all), passMsg }
   done(true, { score, misses }) */
Tasks.playChords = (el, p, done) => {
  const targets = p.chords.map(chordTarget);
  const pass = p.pass == null ? targets.length : p.pass;
  let i = 0, score = 0, misses = 0, timer = 0, finished = false, wait = 0;
  el.innerHTML = `${p.prompt ? `<p class="prompt">${p.prompt}</p>` : ''}<div class="chord-target"><div class="big-name"></div><div class="tones"></div></div>${p.limit ? '<div class="timer"><i></i></div>' : ''}<div class="progress-dots">${'<span></span>'.repeat(targets.length)}</div><div class="heard-chord" aria-live="polite"></div><div class="meter-slot"></div><p class="fb info" aria-live="polite">${Mic.state === 'on' ? 'Play the chord and let it ring. The mic is listening.' : 'Tap the chord’s notes within a second or so, use a MIDI keyboard, or turn on the mic and play a real instrument.'}</p><div class="row" data-retry hidden><button type="button" class="btn small" data-act="retry">Try again</button></div>`;
  const big = el.querySelector('.big-name'), tones = el.querySelector('.tones'), heard = el.querySelector('.heard-chord'), f = el.querySelector('.fb');
  const dots = el.querySelectorAll('.progress-dots span'), bar = el.querySelector('.timer i'), retry = el.querySelector('[data-retry]');
  const offMeter = Mic.state === 'on' ? chromaMeter(el.querySelector('.meter-slot')) : () => {};
  ChordIn.start();
  function show() {
    const T = targets[i];
    big.textContent = p.labels ? p.labels[i] : Theory.pretty(T.sym);
    tones.textContent = p.tones ? T.notes.join(' · ') : '';
    ChordIn.clear();
    if (p.limit) {
      bar.style.transition = 'none'; bar.style.transform = 'scaleX(1)';
      requestAnimationFrame(() => { bar.style.transition = `transform ${p.limit}s linear`; bar.style.transform = 'scaleX(0)'; });
      clearTimeout(timer); timer = setTimeout(() => result(false), p.limit * 1000);
    }
  }
  function result(ok, ev) {
    clearTimeout(timer);
    const T = targets[i];
    dots[i].classList.add(ok ? 'on' : 'miss'); if (ok) score++;
    if (ok) { fb(f, 'good', `${Theory.pretty(T.sym)}: ${T.notes.join(' ')}.${ev && ev.source === 'mic' ? ' Heard it.' : ''}`); Keyboard.markPcs(T.pcs, 'found'); }
    else fb(f, 'bad', `Time. ${Theory.pretty(T.sym)} is ${T.notes.join(' ')}.`);
    i++;
    if (i >= targets.length) {
      finished = true;
      if (score >= pass) { if (targets.length > 1) fb(f, 'good', `${score} of ${targets.length}. ${p.passMsg || 'Done.'}`); done(true, { score, misses }); }
      else { fb(f, 'bad', `${score} of ${targets.length}. You need ${pass}.`); retry.hidden = false; }
      wait = setTimeout(() => Keyboard.clearMarks(), 1200);
    } else wait = setTimeout(() => { Keyboard.clearMarks(); show(); }, 900);
  }
  el.querySelector('[data-act="retry"]').onclick = () => { i = 0; score = 0; misses = 0; finished = false; retry.hidden = true; dots.forEach(d => { d.className = ''; }); show(); };
  const off = Bus.on('chord', ev => {
    if (finished || i >= targets.length) return;
    heard.textContent = (ev.source === 'mic' ? 'Mic hears: ' : 'You played: ') + chordWords(ev);
    if (chordHit(ev, targets[i])) { ChordIn.clear(); result(true, ev); }
    else if (ev.pcs.length < targets[i].pcs.length && ev.pcs.every(pc => targets[i].pcs.indexOf(pc) >= 0)) fb(f, 'info', 'Keep going: those notes are part of it.');
    /* all the right notes plus one more (often the last chord still ringing): a nudge, not a miss */
    else if (ev.pcs.length === targets[i].pcs.length + 1 && targets[i].pcs.every(pc => ev.pcs.indexOf(pc) >= 0)) fb(f, 'info', `Close: I also hear ${Theory.pcName(ev.pcs.find(pc => targets[i].pcs.indexOf(pc) < 0))}. Let the last chord fade, then play it again.`);
    else if (ev.q) { misses++; fb(f, 'bad', `That is ${Theory.pretty(ev.sym)}, not ${Theory.pretty(targets[i].sym)}.${targets[i].bassPc != null && sameSet(ev.pcs, targets[i].pcs) ? ' Right notes; put ' + Theory.pcName(targets[i].bassPc) + ' at the bottom.' : ''}`); }
  });
  show();
  return () => { off(); offMeter(); ChordIn.stop(); clearTimeout(timer); clearTimeout(wait); Keyboard.clearMarks(); };
};

/* ---------- review card types shared by Levels 2–5 ---------- */
/* { type: 'gen', gen() → quiz item }: one generated multiple-choice question */
CARD_TYPES.gen = (el, c, fin) => Tasks.choice(el, c.gen(), fin);
/* { type: 'seq', prompt, notes, show }: play a short sequence; one slip is allowed */
CARD_TYPES.seq = (el, c, fin) => Tasks.playSeq(el, Object.assign({}, c, { notes: typeof c.notes === 'function' ? c.notes() : c.notes }), (ok, r) => fin(r.misses <= 1));
/* { type: 'chord', prompt, chord }: play one named chord; one wrong chord is allowed */
CARD_TYPES.chord = (el, c, fin) => Tasks.playChords(el, { prompt: c.prompt || 'Play this chord.', chords: [typeof c.chord === 'function' ? c.chord() : c.chord], tones: c.tones }, (ok, r) => fin(r.misses <= 1));

/* =================================================================
   Notation and rhythm engine (Level 6 onward)
   Score: a text shorthand for rhythms and melodies, meters, conventional re-writing (normalize), engraving (svg),
   playback with swing, and quantizing taps or played notes into notation.
   MelodyCapture: record a melody from any input, see it engraved, edit it note by note.
   Tasks: rhythmTap, rhythmDictation, meterFeel, capture.

   Durations are quarter notes: w 4, h 2, q 1, e 0.5, s 0.25; dotted ×1.5; triplets ×2/3. Inside, everything runs on
   integer ticks (48 to the quarter), so fractions never need comparing as floats.
   bpm is always quarter notes per minute, in every meter: 6/8 at bpm 90 has its dotted-quarter beat at 60.
   ================================================================= */
const NT_TPQ = 48;
const ntTk = d => Math.round(d * NT_TPQ);
const ntQ = t => t / NT_TPQ;
const NT_VAL = { w: 4, h: 2, q: 1, e: 0.5, s: 0.25, t: 0.125 };
const NT_NAME = { w: 'whole', h: 'half', q: 'quarter', e: 'eighth', s: 'sixteenth', t: '32nd' };
const NT_FLAGS = { w: 0, h: 0, q: 0, e: 1, s: 2, t: 3 };
const NT_BASE = [[192, 'w'], [96, 'h'], [48, 'q'], [24, 'e'], [12, 's'], [6, 't']];
/* the written value of a length in ticks: { b: 'q', dots: 0 | 1 }, or null when no single note shows it */
function ntVal(t) {
  for (const [v, b] of NT_BASE) { if (t === v) return { b, dots: 0 }; if (t === v * 1.5) return { b, dots: 1 }; }
  return null;
}
const ntClone = e => ({ d: +e.d, p: e.p == null || e.rest ? null : e.p, rest: !!e.rest, tie: !!e.tie && !e.rest, tup: e.tup ? 3 : 0 });

/* ---------- the text shorthand ----------
   'q q e e q'  'q. e h'  'q_e e'  '3[e e e] q'  'qr e er'  'C4:q D4:e. E4:s'  '3[C4:e D4:e E4:e]'  ('|' is ignored) */
function ntParse(input) {
  if (input == null) return [];
  if (Array.isArray(input)) return input.map(ntClone);
  const s = String(input).replace(/\|/g, ' ');
  const re = /\s*(?:(3)\[|(\])|(_)|([^\s_[\]]+))/y;
  const tok = /^(?:([A-Ga-g](?:##|#|♯|bb|b|♭|x|𝄪|𝄫|♮)?-?\d):)?([whqest])(\.)?(r)?(\.)?$/u;
  const out = [];
  let tup = 0, tie = false;
  while (re.lastIndex < s.length) {
    const at = re.lastIndex, m = re.exec(s);
    if (!m) { if (/^\s*$/.test(s.slice(at))) break; throw new Error('Not a rhythm: ' + s.slice(at)); }
    if (m[1]) { if (tup) throw new Error('Triplets cannot nest: ' + s); tup = 3; continue; }
    if (m[2]) { if (!tup) throw new Error('Unmatched ] in ' + s); tup = 0; continue; }
    if (m[3]) { tie = true; continue; }
    const t = tok.exec(m[4]);
    if (!t) throw new Error('Not a rhythm: ' + m[4]);
    const rest = !!t[4], prev = out[out.length - 1];
    let p = null;
    if (t[1] && !rest) { const q = Theory.parse(t[1].replace('♮', '')); p = Theory.fmt(q.L, q.acc, q.oct); }
    if (tie && !rest && !p && prev && !prev.rest) p = prev.p;
    const d = NT_VAL[t[2]] * (t[3] || t[5] ? 1.5 : 1) * (tup ? 2 / 3 : 1);
    out.push({ d, p, rest, tie: tie && !rest && !!prev && !prev.rest && prev.p === p, tup });
    tie = false;
  }
  return out;
}

/* ---------- meters ---------- */
const NT_METERS = {};
const NT_LEVELS = new Map();
/* '4/4' '3/4' '2/4' '2/2' '6/8' '9/8' '12/8' '5/4' '7/4' '5/8' '7/8', optionally with a grouping: '7/8:3+2+2', '5/4:2+3' */

const Score = {

/* ---------- shared pieces of the rhythm tasks ---------- */
/* one light per beat group, as wide as the group: 7/8 shows short, short, long */
const ntBeatsHTML = M => `<div class="nt-beats" aria-hidden="true">${M.groups.map((g, i) => `<span class="${i === 0 ? 'strong' : M.accents.indexOf(i) > 0 ? 'acc' : ''}" style="flex-grow:${g}"></span>`).join('')}</div>`;

/* score claps against a rhythm: every sounding onset needs a clap within tol; one stray clap is forgiven (as in

/* Hear a rhythm, then clap or tap it back after a count-in that follows the meter.

  wireTapPad(el);
  const box = el.querySelector('.nt-box'), lights = [...el.querySelectorAll('.nt-beats span')], f = el.querySelector('.fb');
  const dots = el.querySelectorAll('.progress-dots span'), hear = el.querySelector('[data-act="hear"]'), go = el.querySelector('[data-act="go"]'), retry = el.querySelector('[data-retry]');
  const off = Bus.on('onset', d => { if (listening) taps.push(d.t); });
  const draw = (marks, reveal) => {

/* fragments that fill one beat group, for wrong answers that differ from the right one in a single beat */
const NT_FRAGS = {

  72: ['q.', 'q e', 'e q', 'e e e', 'e. s e', 's s e e', 'e e s s', 'er e e', 'q er', 'e er e'],
  96: ['h', 'q q', 'q. e', 'e e q', 'q e e', 'e e e e', 'qr q', 'q qr']

      pl = ntPlay(events, { meter: spec, bpm, swing, click: met.checked, onNote: i => mark(i), onEnd: () => { pl = null; mark(null); bStop.disabled = true; } });
      if (pl) { unlight = ntLights(lights, pl.beats); bStop.disabled = false; }
    }
    function stop() { if (recording) finish(); else stopPlay(); }
    function clear() { if (recording) return; stopPlay(); sel = null; commit(fit([])); say('info', 'Cleared. Record again, or click a rest and press ↑ to write a note.'); }
    bRec.onclick = record; bStop.onclick = stop; bPlay.onclick = play; bClear.onclick = clear;
    rng.oninput = () => { bpm = +rng.value; bpmTxt.innerHTML = ntTempoHTML(spec, bpm); };
    events = fit(o.initial);
    render();
    return {
      get events() { return events.map(ntClone); },
      get notes() { return ntToNotes(events, { bpm, swing, meter: spec }); },
      get bpm() { return bpm; },
      get recording() { return recording; },
      record, stop, play, clear,
      set(evs) { stopPlay(); commit(fit(evs)); },
      setSwing(v) { swing = v; },
      select(i) { const s = sounds().find(x => x.i <= i && x.j >= i); sel = s ? s.a : null; render(); },
      destroy() { alive = false; offs.forEach(fn => fn()); if (recording) { recording = false; stopRecAudio(); } stopPlay(); }
    };
  }
};

/* MelodyCapture with a name and Save.
   p: { prompt, meter, bpm, bars, keySig, clef, countIn, pcs, pcsLabel, min (notes, default 3), check(events) → null | 'message', checkOk (text when it passes), placeholder,
        initial (events), name (default name), swing, save: { level, tags, from, prompt, key, extra } }
   Saves { name, notes, score: { meter, bpm, keySig, events, swing? }, bpm, level, tags, from, key, prompt, …extra }.
   done(true, { sketch, events }) */
Tasks.capture = (el, p, done) => {

  let saved = false;

    <div class="field"><label for="${id}">Name it</label><input id="${id}" type="text" maxlength="40" placeholder="${esc(p.placeholder || 'Give it a name')}" value="${esc(p.name || '')}"></div>
