<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="description" content="Learn music theory by playing: Motif listens to the notes and chords you play and builds your skills a little every day."><meta name="theme-color" content="#2C43D4"><link rel="icon" href="favicon.svg" type="image/svg+xml"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif;background:#fafafa}img{max-width:100%}[hidden]{display:none!important}</style></head><body>
<title>Motif</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=JetBrains+Mono:wght@500;700&family=Noto+Music&display=swap">
<style>
/* Layout: one column of lesson content above a fixed "instrument dock" (readout + keyboard), like a music stand over the keys. */
:root {
  --bg: #F2F4FA;
  --surface: #FFFFFF;
  --surface-2: #E8ECF7;
  --ink: #141A33;
  --muted: #586081;
  --line: #D6DCEC;
  --accent: #2C43D4;
  --accent-ink: #FFFFFF;
  --accent-soft: #E2E6FD;
  --glow: #D9930F;
  --glow-soft: #FBEFD6;
  --good: #14845A;
  --good-soft: #DDF3E9;
  --bad: #C2382F;
  --bad-soft: #FBE3E1;
  --key-w: #FFFFFF;
  --key-w-edge: #C3CBE0;
  --key-b: #191E3A;
  --key-b-top: #2E3563;
  --f-display: 'Bricolage Grotesque', 'Avenir Next', 'Segoe UI', system-ui, sans-serif;
  --f-body: 'Atkinson Hyperlegible', 'Segoe UI', system-ui, -apple-system, sans-serif;
  --f-mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --r: 12px;
  --dock-h: 200px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0D1020; --surface: #151A2E; --surface-2: #1D2340; --ink: #E6E9F6; --muted: #98A1C3; --line: #2A3153;
    --accent: #8090FF; --accent-ink: #0D1020; --accent-soft: #232A57; --glow: #F0B53C; --glow-soft: #3A2E12;
    --good: #3CC48D; --good-soft: #12352A; --bad: #F06A5F; --bad-soft: #3D1D1C;
    --key-w: #DCE1EF; --key-w-edge: #8E97B9; --key-b: #06080F; --key-b-top: #1B2042;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0D1020; --surface: #151A2E; --surface-2: #1D2340; --ink: #E6E9F6; --muted: #98A1C3; --line: #2A3153;
  --accent: #8090FF; --accent-ink: #0D1020; --accent-soft: #232A57; --glow: #F0B53C; --glow-soft: #3A2E12;
  --good: #3CC48D; --good-soft: #12352A; --bad: #F06A5F; --bad-soft: #3D1D1C;
  --key-w: #DCE1EF; --key-w-edge: #8E97B9; --key-b: #06080F; --key-b-top: #1B2042;
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--f-body);
  font-size: 16px;
  line-height: 1.55;
  padding-bottom: calc(var(--dock-h) + 24px);
}
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
h1, h2, h3 { font-family: var(--f-display); line-height: 1.15; text-wrap: balance; margin: 0; letter-spacing: -0.01em; }
p { margin: 0; }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.eyebrow { font-family: var(--f-mono); font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }

/* ---------- top bar ---------- */
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--line);
}
.top-in { max-width: 1040px; margin: 0 auto; padding: 10px 16px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; font-family: var(--f-display); font-weight: 800; font-size: 22px; letter-spacing: -0.02em; background: none; border: 0; padding: 0; }
.brand svg { width: 28px; height: 28px; }
.nav { display: flex; gap: 4px; margin-left: auto; flex-wrap: wrap; }
.nav button { background: none; border: 0; padding: 8px 12px; border-radius: 999px; color: var(--muted); font-weight: 700; font-size: 15px; }
.nav button[aria-current="page"] { background: var(--accent-soft); color: var(--accent); }
.streak { display: inline-flex; align-items: center; gap: 6px; font-family: var(--f-mono); font-size: 13px; color: var(--muted); padding: 6px 10px; border: 1px solid var(--line); border-radius: 999px; }
.streak b { color: var(--ink); }

main { max-width: 1040px; margin: 0 auto; padding-inline: 16px; padding-block: 24px 16px; display: grid; gap: 24px; }

/* ---------- buttons & chips ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 10px 18px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); font-weight: 700; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.ghost { background: transparent; }
.btn.small { min-height: 36px; padding: 6px 12px; font-size: 14px; }
.btn[disabled] { opacity: 0.45; cursor: not-allowed; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; font-size: 13px; font-weight: 700; background: var(--surface-2); color: var(--muted); }
.chip.done { background: var(--good-soft); color: var(--good); }
.chip.next { background: var(--glow-soft); color: var(--glow); }
.chip.live { background: var(--accent-soft); color: var(--accent); }

/* ---------- panels ---------- */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 20px; min-width: 0; }
.grid-2 { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 24px; align-items: start; }
@media (max-width: 760px) { .grid-2 { grid-template-columns: minmax(0, 1fr); } }

.today h2 { font-size: clamp(26px, 4vw, 34px); margin-top: 6px; }
.today .lead { color: var(--muted); margin-top: 8px; max-width: 52ch; }
.today .row { margin-top: 18px; }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.stat { padding: 14px; border-radius: 10px; background: var(--surface-2); min-width: 0; }
.stat b { display: block; font-family: var(--f-display); font-size: 28px; line-height: 1.1; font-variant-numeric: tabular-nums; }
.stat span { font-size: 13px; color: var(--muted); }

.mic-note { display: flex; gap: 12px; align-items: flex-start; padding: 14px; border-radius: 10px; border: 1px dashed var(--line); color: var(--muted); font-size: 14px; margin-top: 16px; }
.mic-note b { color: var(--ink); }

/* level path */
.level-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.level-head h2 { font-size: 26px; }
.staff-wrap { overflow-x: auto; margin: 12px -4px 4px; }
.staff { width: 100%; min-width: 520px; height: auto; display: block; }
.staff .line { stroke: var(--line); stroke-width: 1.4; }
.staff .head { cursor: pointer; }
.staff .head ellipse { stroke: var(--muted); stroke-width: 1.6; fill: var(--surface); transition: transform .2s; }
.staff .head.done ellipse { fill: var(--accent); stroke: var(--accent); }
.staff .head.next ellipse { fill: var(--glow); stroke: var(--glow); }
.staff .head:hover ellipse, .staff .head:focus-visible ellipse { stroke: var(--accent); stroke-width: 2.4; }
.staff .lbl { font-family: var(--f-mono); font-size: 11px; fill: var(--muted); }
.staff .bar { stroke: var(--ink); }
.staff .bossmark text { font-family: var(--f-mono); font-size: 11px; fill: var(--muted); }

.units { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 230px), 1fr)); gap: 10px; margin-top: 12px; }
.unit { text-align: left; display: grid; gap: 4px; padding: 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); min-width: 0; }
.unit:hover { border-color: var(--accent); }
.unit .top-line { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.unit .num { font-family: var(--f-mono); font-size: 13px; color: var(--muted); }
.unit h3 { font-size: 17px; }
.unit p { font-size: 14px; color: var(--muted); }
.unit.boss { border-color: var(--ink); background: var(--surface-2); }

.later { display: grid; gap: 8px; }
.later .item { display: flex; justify-content: space-between; gap: 12px; padding: 12px 14px; border-radius: 10px; background: var(--surface-2); color: var(--muted); font-size: 14px; }
.later .item b { color: var(--ink); font-family: var(--f-display); font-size: 16px; }

/* ---------- lesson ---------- */
.lesson-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.lesson-head h1 { font-size: clamp(26px, 4.5vw, 38px); }
.arc { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 14px; }
.arc span { font-family: var(--f-mono); font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; padding: 5px 10px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); }
.arc span.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.arc span.past { color: var(--accent); border-color: var(--accent); }
.stage { margin-top: 18px; display: grid; gap: 16px; }
.stage .tag { font-family: var(--f-mono); font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent); }
.stage h2 { font-size: 24px; }
.stage .body { display: grid; gap: 10px; max-width: 62ch; }
.prompt { font-size: 19px; font-weight: 700; max-width: 52ch; }
.fb { min-height: 1.6em; font-weight: 700; }
.fb.good { color: var(--good); }
.fb.bad { color: var(--bad); }
.fb.info { color: var(--muted); }
.stepnav { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; border-top: 1px solid var(--line); padding-top: 16px; margin-top: 4px; }
.skip { background: none; border: 0; color: var(--muted); text-decoration: underline; text-underline-offset: 3px; padding: 8px 4px; }

.big-name { font-family: var(--f-display); font-weight: 800; font-size: clamp(54px, 12vw, 96px); line-height: 1; letter-spacing: -0.03em; }
.progress-dots { display: flex; gap: 8px; }
.progress-dots span { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--line); }
.progress-dots span.on { background: var(--accent); border-color: var(--accent); }
.progress-dots span.miss { background: var(--bad); border-color: var(--bad); }
.timer { height: 6px; background: var(--surface-2); border-radius: 3px; overflow: hidden; }
.timer i { display: block; height: 100%; background: var(--glow); width: 100%; transform-origin: left; }

.lane-wrap { border-radius: 10px; background: var(--surface-2); overflow: hidden; }
.lane { width: 100%; height: 220px; display: block; }

.choices { display: flex; flex-wrap: wrap; gap: 8px; }
.choice { min-height: 44px; padding: 8px 16px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--surface); font-weight: 700; font-size: 17px; }
.choice[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
.choice.right { border-color: var(--good); background: var(--good-soft); color: var(--good); }
.choice.wrong { border-color: var(--bad); background: var(--bad-soft); color: var(--bad); }

.notes-strip { display: flex; flex-wrap: wrap; gap: 6px; min-height: 40px; align-items: center; }
.notes-strip .n { font-family: var(--f-mono); font-weight: 700; padding: 6px 10px; border-radius: 8px; background: var(--accent-soft); color: var(--accent); }
.notes-strip .n.off { background: var(--bad-soft); color: var(--bad); }
.notes-strip .empty { color: var(--muted); font-size: 14px; }

.beats { display: flex; gap: 10px; align-items: center; }
.beats span { width: 28px; height: 28px; border-radius: 50%; background: var(--surface-2); border: 2px solid var(--line); transition: background .05s; }
.beats span.strong { width: 40px; height: 40px; }
.beats span.lit { background: var(--glow); border-color: var(--glow); }
.tap-pad { width: 100%; min-height: 96px; border-radius: 14px; border: 2px dashed var(--accent); background: var(--accent-soft); color: var(--accent); font-family: var(--f-display); font-weight: 800; font-size: 22px; touch-action: manipulation; user-select: none; }
.tap-pad:active { background: var(--accent); color: var(--accent-ink); }
.offsets { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 6px; }
.offsets div { display: grid; gap: 4px; justify-items: center; font-family: var(--f-mono); font-size: 12px; color: var(--muted); }
.offsets .bar { width: 100%; height: 44px; background: var(--surface-2); border-radius: 6px; position: relative; overflow: hidden; }
.offsets .bar::after { content: ""; position: absolute; left: 0; right: 0; top: 50%; border-top: 1px solid var(--line); }
.offsets .bar i { position: absolute; left: 20%; right: 20%; height: 6px; border-radius: 3px; background: var(--good); }
.offsets .bar i.late, .offsets .bar i.early { background: var(--glow); }
.offsets .bar i.miss { background: var(--bad); top: calc(50% - 3px) !important; }

.notation { overflow-x: auto; }
.notation svg { display: block; max-width: 100%; height: auto; }
.notation .ink { fill: var(--ink); stroke: var(--ink); }
.notation .hollow { fill: var(--surface); stroke: var(--ink); stroke-width: 2; }
.notation .syl { font-family: var(--f-mono); font-size: 13px; fill: var(--muted); }
.notation .ok { fill: var(--good); }
.notation .no { fill: var(--bad); }
.notation .ts { font-family: var(--f-display); font-weight: 800; font-size: 20px; fill: var(--ink); }

.fret { overflow-x: auto; }
.fret svg { display: block; min-width: 560px; width: 100%; height: auto; }
.fret text { font-family: var(--f-mono); font-size: 12px; fill: var(--ink); }
.fret .num { fill: var(--muted); font-size: 11px; }
.fret line { stroke: var(--line); }
.fret .string { stroke: var(--muted); stroke-width: 2; }
.fret .dot { fill: var(--accent-soft); stroke: var(--accent); }
.fret .dot.blk { fill: var(--key-b); stroke: var(--key-b); }
.fret .blk + text, .fret text.on-blk { fill: #FFFFFF; }

.done-card { display: grid; gap: 14px; justify-items: start; }
.done-card .big { font-family: var(--f-display); font-weight: 800; font-size: clamp(30px, 5vw, 44px); }

/* daily set strip */
.strip { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px; margin-top: 12px; }
.strip div { font-size: 12px; text-align: center; padding: 8px 4px; border-radius: 8px; background: var(--surface-2); color: var(--muted); font-weight: 700; min-width: 0; overflow-wrap: anywhere; }
.strip div.on { background: var(--accent); color: var(--accent-ink); }
.strip div.past { background: var(--accent-soft); color: var(--accent); }
@media (max-width: 520px) { .strip div { font-size: 10.5px; } }

.one-percent { font-family: var(--f-display); font-size: clamp(26px, 5vw, 40px); font-weight: 800; }

/* sketchbook & setup */
.sketches { display: grid; gap: 10px; }
.sketch { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
.sketch h3 { font-size: 18px; overflow-wrap: anywhere; }
.sketch .meta { font-size: 13px; color: var(--muted); }
.empty-state { padding: 28px; border: 1px dashed var(--line); border-radius: 12px; color: var(--muted); display: grid; gap: 10px; justify-items: start; }
.field { display: grid; gap: 6px; }
.field input[type="text"] { min-height: 44px; padding: 8px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); width: 100%; max-width: 360px; }
.kbd-map { display: flex; flex-wrap: wrap; gap: 6px; }
.kbd-map kbd { font-family: var(--f-mono); font-size: 13px; padding: 4px 8px; border-radius: 6px; border: 1px solid var(--line); background: var(--surface-2); }
.setup-list { display: grid; gap: 16px; }
.setup-list .panel h2 { font-size: 20px; margin-bottom: 8px; }
.setup-list .panel p { color: var(--muted); max-width: 64ch; }
.setup-list .panel .row { margin-top: 12px; }
.toggle { display: inline-flex; align-items: center; gap: 10px; font-weight: 700; }
.toggle input { width: 20px; height: 20px; accent-color: var(--accent); }
input[type="range"] { accent-color: var(--accent); width: min(100%, 280px); }

/* ---------- instrument dock ---------- */
.dock {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
  background: var(--surface); border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  box-shadow: 0 -8px 24px color-mix(in srgb, var(--ink) 8%, transparent);
}
.dock-in { max-width: 1040px; margin: 0 auto; padding: 10px 16px 12px; display: grid; gap: 10px; }
.readout { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; min-height: 40px; }
.readout .heard { font-family: var(--f-display); font-weight: 800; font-size: 28px; min-width: 3.2ch; line-height: 1; }
.cents { position: relative; width: 120px; height: 12px; border-radius: 6px; background: var(--surface-2); }
.cents::before { content: ""; position: absolute; left: 50%; top: -3px; bottom: -3px; width: 2px; background: var(--muted); }
.cents i { position: absolute; top: 1px; width: 10px; height: 10px; border-radius: 50%; background: var(--glow); left: calc(50% - 5px); transition: left .08s; }
.cents.in-tune i { background: var(--good); }
.readout .hint { font-size: 13px; color: var(--muted); flex: 1 1 200px; min-width: 0; }
.mic-pill { display: inline-flex; align-items: center; gap: 8px; border-radius: 999px; padding: 6px 12px; font-size: 13px; font-weight: 700; border: 1px solid var(--line); background: var(--surface); margin-left: auto; }
.mic-pill .lvl { width: 40px; height: 6px; border-radius: 3px; background: var(--surface-2); overflow: hidden; }
.mic-pill .lvl i { display: block; height: 100%; width: 0; background: var(--good); }
.mic-pill.on { border-color: var(--good); color: var(--good); }
.mic-pill.blocked { border-color: var(--bad); color: var(--bad); }

.kb { position: relative; height: 120px; user-select: none; -webkit-user-select: none; touch-action: none; }
@media (max-width: 520px) { .kb { height: 104px; } }
.key { position: absolute; top: 0; border: 1px solid var(--key-w-edge); display: flex; align-items: flex-end; justify-content: center; padding-bottom: 6px; font-family: var(--f-mono); font-size: 11px; }
.key.w { height: 100%; background: var(--key-w); color: #5A6280; border-radius: 0 0 7px 7px; z-index: 1; }
.key.b { height: 62%; background: linear-gradient(var(--key-b-top), var(--key-b)); border-color: var(--key-b); color: #C9CFE6; border-radius: 0 0 5px 5px; z-index: 2; font-size: 9px; }
.key.down.w { background: var(--accent-soft); }
.key.down.b { background: var(--accent); }
.key.hint { box-shadow: inset 0 -6px 0 var(--glow); }
.key.b.hint { box-shadow: inset 0 -6px 0 var(--glow); }
.key.target { box-shadow: inset 0 0 0 3px var(--glow); }
.key.found.w { background: var(--good-soft); }
.key.found.b { background: var(--good); }
.key.ok.w { background: var(--good-soft) !important; }
.key.ok.b { background: var(--good) !important; }
.key.no.w { background: var(--bad-soft) !important; }
.key.no.b { background: var(--bad) !important; }
.key.lit.w { background: var(--glow-soft); }
.key.lit.b { background: var(--glow); }
.kb.nolabels .key span { visibility: hidden; }
.kb .key span.c { color: var(--accent); font-weight: 700; }

.confirm { display: inline-flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 14px; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; animation: none !important; }
}

/* ---------- shared components: level tabs, staff notation, circle, chord input ---------- */
:root { --f-music: 'Noto Music', 'Bravura Text', 'Segoe UI Symbol', 'Apple Symbols', 'Symbola', serif; }

/* level tabs on home */
.level-tabs { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; }
.level-tabs button { display: grid; gap: 2px; justify-items: start; text-align: left; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); min-width: 0; position: relative; }
.level-tabs .mono { font-size: 12px; color: var(--muted); }
.level-tabs .t { font-family: var(--f-display); font-weight: 800; font-size: 15px; line-height: 1.2; overflow-wrap: anywhere; }
.level-tabs .st { position: absolute; top: 8px; right: 10px; font-size: 12px; }
.level-tabs .passed .st { color: var(--good); font-weight: 800; }
.level-tabs .locked { color: var(--muted); background: var(--surface-2); }
.level-tabs button[aria-current="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
@media (max-width: 640px) {
  .level-tabs { grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 4px; }
  .level-tabs .t { display: none; }
  .level-tabs button { justify-items: center; padding: 10px 4px; }
  .level-tabs .mono { font-size: 15px; font-weight: 700; color: inherit; }
  .level-tabs .st { top: 2px; right: 4px; font-size: 10px; }
}
.tagline { color: var(--muted); font-size: 14px; margin-top: 4px; }
.locked-note { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; margin-top: 12px; padding: 12px 14px; border-radius: 10px; background: var(--surface-2); color: var(--muted); font-size: 14px; }
.staff.locked { opacity: 0.5; }
.unit[disabled] { opacity: 0.55; cursor: not-allowed; }
.unit[disabled]:hover { border-color: var(--line); }
.grad { border-color: var(--good); background: var(--good-soft); display: grid; gap: 6px; }
.grad h2 { font-size: 24px; }

/* pictures inside lesson steps */
.art, .q-art, .widget { overflow-x: auto; }
.art svg, .q-art svg { display: block; max-width: 100%; height: auto; }
.q-art { margin: 4px 0; }

/* staff notation */
.nstaff { display: block; max-width: 100%; height: auto; color: var(--ink); }
.nstaff .sl { stroke: var(--ink); stroke-width: 1; opacity: 0.75; }
.nstaff .ledger { opacity: 0.9; }
.nstaff .clef { font-family: var(--f-music); fill: var(--ink); }
.nstaff .acc { font-family: var(--f-music); font-size: 34px; fill: var(--ink); }
.nstaff .tsig { font-family: var(--f-display); font-weight: 800; font-size: 21px; fill: var(--ink); }
.nstaff .head { fill: none; stroke: var(--ink); stroke-width: 2.2; }
.nstaff .head.filled { fill: var(--ink); stroke-width: 1; }
.nstaff .stem { stroke: var(--ink); stroke-width: 1.4; }
.nstaff .head.ok { stroke: var(--good); }
.nstaff .head.filled.ok { fill: var(--good); }
.nstaff .head.no { stroke: var(--bad); }
.nstaff .head.filled.no { fill: var(--bad); }
.nstaff .head.target { stroke: var(--glow); stroke-width: 3; }
.nstaff .nlabel { font-family: var(--f-mono); font-size: 12px; fill: var(--muted); }
.nstaff .nlabel.ok { fill: var(--good); }
.nstaff .nlabel.no { fill: var(--bad); }

/* circle of fifths */
.circle5 { display: block; width: 100%; max-width: 420px; height: auto; margin: 0 auto; user-select: none; -webkit-user-select: none; }
.circle5 .wedge path { stroke: var(--surface); stroke-width: 2; transition: fill .15s; }
.circle5 .wedge.major path { fill: var(--surface-2); }
.circle5 .wedge.minor path { fill: color-mix(in srgb, var(--surface-2) 55%, var(--surface)); }
.circle5 .wedge[role="button"] { cursor: pointer; }
.circle5 .wedge[role="button"]:hover path, .circle5 .wedge:focus-visible path { fill: var(--accent-soft); }
.circle5 .wedge:focus { outline: none; }
.circle5 .wedge.fam path { fill: var(--glow-soft); }
.circle5 .wedge.sel path { fill: var(--accent); }
.circle5 .wedge.sel text { fill: var(--accent-ink); }
.circle5 .wedge.ok path { fill: var(--good-soft); }
.circle5 .wedge.no path { fill: var(--bad-soft); }
.circle5 .wedge.ask path { fill: var(--glow); }
.circle5 .kname { font-family: var(--f-display); font-weight: 800; font-size: 19px; fill: var(--ink); pointer-events: none; }
.circle5 .kalt { font-family: var(--f-mono); font-size: 10px; fill: var(--muted); pointer-events: none; }
.circle5 .ksig { font-family: var(--f-mono); font-size: 9.5px; fill: var(--muted); pointer-events: none; }
.circle5 .mname { font-family: var(--f-display); font-weight: 600; font-size: 13.5px; fill: var(--ink); pointer-events: none; }
.circle5 .froman { font-family: var(--f-mono); font-weight: 700; font-size: 11px; fill: var(--glow); pointer-events: none; }
.circle5 .wedge.sel .froman { fill: var(--accent-ink); }
.circle5 .hub { fill: var(--surface); stroke: var(--line); }
.circle5 .hubtxt { font-family: var(--f-display); font-weight: 800; font-size: 16px; fill: var(--ink); }
.circle5 .hubtxt.sub { font-family: var(--f-mono); font-weight: 500; font-size: 11.5px; fill: var(--muted); }

/* note sequences and steps */
.notes-strip.seq { gap: 4px; }
.notes-strip .n.hid { background: var(--surface-2); color: var(--muted); }
.notes-strip .n.cur { outline: 2px solid var(--glow); outline-offset: 1px; }
.notes-strip .n.ok { background: var(--good-soft); color: var(--good); }
.notes-strip .stp { font-family: var(--f-mono); font-size: 11px; color: var(--muted); min-width: 1.6em; text-align: center; }
.notes-strip .stp.on { color: var(--accent); font-weight: 700; }

/* chord tasks */
.chord-target { display: grid; gap: 2px; }
.chord-target .tones { font-family: var(--f-mono); color: var(--muted); min-height: 1.4em; }
.heard-chord { font-family: var(--f-mono); font-size: 14px; color: var(--muted); min-height: 1.5em; }
.chroma { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 4px; align-items: end; height: 70px; padding: 6px; border-radius: 10px; background: var(--surface-2); }
.chroma div { display: grid; grid-template-rows: 1fr auto; height: 100%; gap: 2px; justify-items: center; }
.chroma i { width: 100%; height: 100%; background: var(--accent); border-radius: 3px 3px 0 0; transform-origin: bottom; transform: scaleY(0.02); transition: transform .08s; }
.chroma span { font-family: var(--f-mono); font-size: 10px; color: var(--muted); }

.quiz-q { display: grid; gap: 12px; }

/* tables of recipes and hooks */
.tbl { width: 100%; border-collapse: collapse; font-size: 15px; }
.tbl th, .tbl td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
.tbl th { font-family: var(--f-mono); font-size: 12px; color: var(--muted); font-weight: 500; }
.tbl thead th, .tools .tbl th { letter-spacing: .06em; text-transform: uppercase; }
.tbl-wrap { overflow-x: auto; }
.hook { padding: 12px 14px; border-radius: 10px; border-left: 4px solid var(--glow); background: var(--glow-soft); }
.hook b { font-family: var(--f-display); }

/* ---------- notation engine: engraved scores, rhythm tasks, melody capture ---------- */

/* a score sits in a box that scrolls sideways when it is longer than the screen; the page never does */
.nt-task, .nt-cap { display: grid; gap: 12px; min-width: 0; }
.nt-task [hidden], .nt-cap [hidden] { display: none !important; }
.nt-box { overflow-x: auto; overflow-y: hidden; max-width: 100%; contain: inline-size; padding: 4px 2px; -webkit-overflow-scrolling: touch; overscroll-behavior-x: contain; }
.nt-box > svg, .art .nt-box > svg, .q-art .nt-box > svg, .nt-opt > svg { display: block; max-width: none; height: auto; }
.art .nt-box + .nt-box, .art .nt-box + p, .art p + .nt-box { margin-top: 8px; }
.nt-art-cap { font-family: var(--f-mono); font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); margin-top: 10px; }
.art > .nt-art-cap:first-child, .art > .nt-box:first-child { margin-top: 14px; }
.nt-note { font-family: var(--f-music); font-size: 1.2em; line-height: 1; letter-spacing: -0.12em; margin-right: 0.12em; }
.nt-chips { display: flex; flex-wrap: wrap; gap: 8px; }
.nt-chips small { font-weight: 500; }
.nt-hidden { color: var(--muted); font-size: 14px; padding: 16px 6px; }

/* the engraving */
.ntn { color: var(--ink); }
.ntn .nt-sl { stroke: var(--ink); stroke-width: 1; opacity: 0.75; }
.ntn .nt-ledger { stroke: var(--ink); stroke-width: 1.2; opacity: 0.9; }
.ntn .nt-bar { stroke: var(--ink); stroke-width: 1.3; }
.ntn .nt-bar-end, .ntn .nt-pclef { fill: var(--ink); }
.ntn .nt-clef { font-family: var(--f-music); fill: var(--ink); }
.ntn .nt-acc { font-family: var(--f-music); font-size: 34px; fill: var(--ink); }
.ntn .nt-ts { font-family: var(--f-display); font-weight: 800; font-size: 21px; fill: var(--ink); }
.ntn .nt-hd, .ntn .nt-flag, .ntn .nt-beam, .ntn .nt-dot, .ntn .nt-rest, .ntn .nt-tie { fill: var(--ink); }
.ntn .nt-stem { stroke: var(--ink); stroke-width: 1.3; }
.ntn .nt-rest-st { fill: none; stroke: var(--ink); stroke-width: 1.6; stroke-linecap: round; }
.ntn .nt-brk { fill: none; stroke: var(--ink); stroke-width: 1.2; }
.ntn .nt-tup { font-family: var(--f-body); font-style: italic; font-weight: 700; font-size: 13px; fill: var(--ink); }
.ntn .nt-cnt { font-family: var(--f-mono); font-size: 12px; fill: var(--muted); }
.ntn .nt-cnt.beat { fill: var(--ink); font-weight: 700; }
.ntn .nt-syl, .ntn .nt-lab { font-family: var(--f-mono); font-size: 12px; fill: var(--muted); }
.ntn .nt-mk.ok { fill: var(--good); }
.ntn .nt-mk.no { fill: var(--bad); }
.ntn .nt-ev.ok .nt-hd { fill: var(--good); }
.ntn .nt-ev.no .nt-hd { fill: var(--bad); }
.ntn .nt-selbg { fill: var(--accent-soft); }
.ntn .nt-ev.sel .nt-hd, .ntn .nt-ev.sel .nt-flag, .ntn .nt-ev.sel .nt-dot, .ntn .nt-ev.sel .nt-rest { fill: var(--accent); }
.ntn .nt-ev.sel .nt-stem, .ntn .nt-ev.sel .nt-rest-st { stroke: var(--accent); }
.ntn .nt-ev.sel .nt-acc { fill: var(--accent); }
.ntn .nt-ev.now .nt-hd, .ntn .nt-ev.now .nt-rest { fill: var(--glow); }
.ntn .nt-hit { fill: transparent; pointer-events: all; cursor: pointer; }

/* beat lights: one per beat group, as wide as the group (7/8 reads short, short, long) */
.nt-beats { display: flex; gap: 6px; width: 100%; max-width: 420px; }
.nt-beats span { flex-basis: 0; min-width: 14px; height: 16px; border-radius: 8px; background: var(--surface-2); border: 2px solid var(--line); transition: background .05s; }
.nt-beats span.strong { border-color: var(--muted); }
.nt-beats span.acc { border-color: color-mix(in srgb, var(--muted) 60%, var(--line)); }
.nt-beats span.lit { background: var(--glow); border-color: var(--glow); }

/* dictation: choose the notation */
.nt-dict .choices { display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; }
.nt-dict .choice { display: block; width: 100%; min-width: 0; padding: 6px 8px; text-align: left; overflow: hidden; }
.nt-opt { display: block; overflow-x: auto; max-width: 100%; }
.nt-dict .choice.right .nt-hd, .nt-dict .choice.right .nt-beam, .nt-dict .choice.right .nt-flag, .nt-dict .choice.right .nt-rest { fill: var(--good); }
.nt-dict .choice.right .nt-stem, .nt-dict .choice.right .nt-rest-st { stroke: var(--good); }
.nt-yours { display: grid; gap: 4px; }

/* melody capture */
.nt-tools { display: grid; gap: 8px; }
.nt-tempo { display: inline-flex; align-items: center; gap: 8px; font-weight: 700; font-size: 14px; flex-wrap: wrap; }
.nt-tempo input[type="range"] { width: 150px; }
.nt-tempo .mono { min-width: 5.5em; }
.nt-met { font-size: 14px; }
.nt-edit { border: 1px solid var(--line); border-radius: 10px; background: var(--surface); padding: 6px 4px; }
.nt-edit:focus { outline: none; border-color: var(--accent); }
.nt-edit:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.nt-ed { display: flex; flex-wrap: wrap; gap: 6px; }
.nt-ed .btn.small { min-width: 40px; padding: 6px 10px; }
.nt-info { font-family: var(--f-mono); font-size: 13px; color: var(--muted); min-height: 1.4em; }
.nt-checks { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; font-size: 14px; color: var(--muted); }
.nt-checks li.ok { color: var(--good); font-weight: 700; }
.nt-cap .tap-pad { min-height: 72px; font-size: 18px; }

/* scores as answer choices (dictation, review cards) */
.choices:has(.nt-opt) { display: grid; grid-template-columns: minmax(0, 1fr); }
.choice:has(.nt-opt) { display: block; width: 100%; min-width: 0; padding: 6px 8px; text-align: left; overflow: hidden; }
.choice.right .nt-opt .nt-hd, .choice.right .nt-opt .nt-beam, .choice.right .nt-opt .nt-flag, .choice.right .nt-opt .nt-rest, .choice.right .nt-opt .nt-dot, .choice.right .nt-opt .nt-tie { fill: var(--good); }
.choice.right .nt-opt .nt-stem, .choice.right .nt-opt .nt-rest-st { stroke: var(--good); }
.choice.wrong .nt-opt .nt-hd, .choice.wrong .nt-opt .nt-beam, .choice.wrong .nt-opt .nt-flag { fill: var(--bad); }
.choice.wrong .nt-opt .nt-stem { stroke: var(--bad); }

/* Level 6 rhythm units */
.l6r-two { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin-top: 12px; }
@media (max-width: 640px) { .l6r-two { grid-template-columns: minmax(0, 1fr); } }
.l6r-way { display: grid; gap: 6px; padding: 12px; border-radius: 12px; background: var(--surface-2); min-width: 0; }
.l6r-way .nt-box { background: var(--surface); border-radius: 8px; }
.l6r-note { font-family: var(--f-mono); font-size: 13px; color: var(--muted); }
.l6r-deeper { font-size: 14px; color: var(--muted); }
.l6r-swing { display: grid; gap: 8px; margin-top: 12px; min-width: 0; }
.l6r-cap { min-width: 0; }

/* ---------- intermediate section: level sections, degree ear, Variation Lab, contour, projects ---------- */
.level-sections { display: grid; gap: 12px; }
.level-section { display: grid; gap: 6px; }

.deg-ask { min-height: 1.1em; }
.deg-choices .choice { min-width: 76px; }
.ear-head { margin-bottom: 4px; }

.vl-pick { display: grid; gap: 6px; }
.vl-box { display: grid; gap: 8px; padding: 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); min-width: 0; }
.vl-head { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.vl-head .eyebrow { margin-right: auto; }
.vl-tools { display: flex; flex-wrap: wrap; gap: 6px; }
.vl-what { color: var(--muted); font-size: 15px; }
.vl-trail { font-family: var(--f-mono); font-size: 12px; color: var(--muted); }

.contour { display: block; width: 100%; max-width: 360px; height: auto; background: var(--surface-2); border-radius: 10px; }
.contour polyline { fill: none; stroke: var(--accent); stroke-width: 2.5; stroke-linejoin: round; }
.contour circle { fill: var(--accent); }
.contour circle.peak { fill: var(--glow); }

.rubric { display: grid; gap: 10px; }
.rub { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin: 0; display: grid; gap: 8px; min-width: 0; }
.rub legend { display: grid; gap: 2px; padding: 0 4px; }
.ab { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.ab-side { display: grid; gap: 8px; justify-items: start; padding: 12px; border-radius: 10px; background: var(--surface-2); min-width: 0; }
@media (max-width: 520px) { .ab { grid-template-columns: minmax(0, 1fr); } }
.fl-note { min-height: 1.4em; }

/* ---------- Level 2: staff sprint, asked notes, scale pictures, interval options, rhythm extras, phrase builder ---------- */

/* every Level 2 task stacks its parts with even spacing; [hidden] wins over display in both builds */
.l2-task, .l2-build, .l2-st { display: grid; gap: 12px; min-width: 0; }
.l2-task [hidden] { display: none !important; }
.l2-task .progress-dots { flex-wrap: wrap; }
.l2-quiz .quiz-q { display: grid; gap: 12px; min-width: 0; }

/* staff sprint and staff questions: one big note to read */
.l2-sprint { display: grid; place-items: center; padding: 10px 8px; border-radius: 12px; background: var(--surface-2); min-height: 140px; }
.l2-sprint .nstaff { width: min(100%, 300px); }
.l2-sprint.grand .nstaff { width: min(100%, 250px); }
.l2-sprint .nstaff .nlabel { font-size: 13px; font-weight: 700; }
.l2-qstaff { display: grid; place-items: center; padding: 6px; border-radius: 10px; background: var(--surface-2); }
.l2-qstaff .nstaff { width: min(100%, 280px); }

/* "Play mi in G major" */
.l2-ask { display: grid; gap: 4px; }
.l2-ask .q { font-family: var(--f-display); font-weight: 800; font-size: clamp(26px, 6vw, 36px); line-height: 1.15; letter-spacing: -0.01em; }
.l2-ask .q b { color: var(--accent); }
.l2-ask .sub { color: var(--muted); }

/* choices with a second line (song anchors, sketches) */
.l2-opt { display: grid; gap: 1px; text-align: left; line-height: 1.25; }
.l2-opt small { font-size: 13px; font-weight: 400; color: var(--muted); overflow-wrap: anywhere; }
.choice.right .l2-opt small, .choice.wrong .l2-opt small, .choice[aria-pressed="true"] .l2-opt small { color: inherit; }

/* scale recipe as W/H chips, and C major with its gaps */
.l2-recipe { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.l2-recipe span { font-family: var(--f-mono); font-weight: 700; font-size: 13px; padding: 4px 9px; border-radius: 8px; background: var(--surface-2); color: var(--muted); }
.l2-recipe span.h { background: var(--accent-soft); color: var(--accent); }
.l2-recipe span.lab { background: none; padding-left: 0; font-weight: 500; letter-spacing: .06em; text-transform: uppercase; font-size: 12px; }
.l2-steps { display: flex; align-items: flex-start; width: 100%; max-width: 560px; margin-top: 6px; }
.l2-steps .nt { flex: 0 0 auto; width: 30px; height: 30px; display: grid; place-items: center; border-radius: 8px; font-family: var(--f-mono); font-weight: 700; font-size: 14px; background: var(--accent-soft); color: var(--accent); }
.l2-steps .nt.b { background: var(--glow-soft); color: var(--ink); }
.l2-steps .gp { flex: 2 1 0; min-width: 8px; display: grid; justify-items: center; gap: 3px; padding-top: 14px; font-family: var(--f-mono); font-size: 12px; color: var(--muted); }
.l2-steps .gp::before { content: ""; display: block; width: 100%; border-top: 2px solid var(--line); }
.l2-steps .gp.h { flex-grow: 1; color: var(--accent); font-weight: 700; }
.l2-steps .gp.h::before { border-color: var(--accent); }
.l2-steps .gp.join::before { border-top-style: dashed; border-color: var(--glow); }
@media (max-width: 480px) {
  .l2-steps .nt { width: 26px; height: 26px; font-size: 13px; border-radius: 7px; }
  .l2-steps .gp { padding-top: 12px; font-size: 11px; }
}
.l2-halves { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 8px; font-family: var(--f-mono); font-size: 12px; color: var(--muted); }
.l2-reveal { display: grid; gap: 8px; }
.l2-art2 { display: grid; gap: 8px; margin-top: 6px; }

/* interval table */
.l2-itbl td { vertical-align: middle; }
.l2-itbl td:first-child { width: 52px; }
.l2-itbl small { display: block; font-size: 13px; color: var(--muted); }
.l2-itbl .btn.small { min-width: 40px; padding: 6px 10px; }
.l2-sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* rhythm notation extras (ties, flags, rests, counts) */
.notation .l2stroke { fill: none; stroke: var(--ink); stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.notation .l2fill { fill: var(--ink); }
.notation .l2tie { fill: none; stroke: var(--ink); stroke-width: 1.8; }
.notation .l2cnt { font-family: var(--f-mono); font-size: 12px; fill: var(--muted); }
.notation .l2cnt.beat { fill: var(--ink); font-weight: 700; }
.art .notation + .notation { margin-top: 8px; }
.l2-rhead { display: flex; flex-wrap: wrap; gap: 8px; }

/* phrase builder */
.l2-pick { display: flex; flex-wrap: wrap; gap: 8px; }
.l2-pick .choice { max-width: 100%; }
.l2-grow { display: grid; gap: 12px; }
.l2-from { color: var(--muted); max-width: 62ch; }
.notes-strip .n.op { background: var(--glow-soft); color: var(--ink); }
.l2-end { font-weight: 700; min-height: 1.5em; }
.l2-end.good { color: var(--good); }
.l2-end.info { color: var(--muted); }

/* ---------- Level 3 · Stack It: chord namer, explorer chips, guitar boxes, piano shapes, harmonizer ---------- */

/* task layouts: stack the parts with a little air */
.l3-task { display: grid; gap: 12px; }
.l3-showrow { margin-top: 10px; }

/* 3.1: the app names your first chord */
.l3-first { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: stretch; }
.l3-namer { display: grid; align-content: center; gap: 4px; padding: 14px 16px; border-radius: var(--r); border: 2px dashed var(--line); background: var(--surface-2); min-width: 0; transition: border-color .2s, background .2s; }
.l3-namer .big-name { overflow-wrap: anywhere; }
.l3-namer.hit { border-style: solid; border-color: var(--good); background: var(--good-soft); }
.l3-namer.hit .big-name { color: var(--good); animation: l3pop .35s ease-out; }
@keyframes l3pop { from { transform: scale(0.8); } to { transform: scale(1); } }
.l3-namer .big-name.idle { color: var(--muted); opacity: 0.5; }
.l3-namer-sub { font-family: var(--f-mono); font-size: 14px; color: var(--muted); min-height: 1.4em; }
.l3-fig { margin: 0; display: grid; justify-items: center; gap: 2px; padding: 6px 8px; border-radius: var(--r); border: 1px solid var(--line); background: var(--surface); }
.l3-fig figcaption { font-size: 12px; color: var(--muted); }
.l3-fig .l3-g { width: 96px; height: auto; }
.l3-how { font-size: 14px; color: var(--muted); max-width: 62ch; }
.l3-how b { color: var(--ink); }

/* chord chips (explorer) */
.l3-ex { display: grid; gap: 10px; margin-top: 14px; }
.l3-chips .choice { display: inline-grid; justify-items: center; line-height: 1.15; min-width: 52px; }
.l3-chips .choice small { font-family: var(--f-mono); font-size: 11px; font-weight: 500; color: var(--muted); }
.l3-chips .choice[aria-pressed="true"] small { color: inherit; }
.l3-info { font-family: var(--f-mono); font-size: 14px; color: var(--muted); min-height: 1.5em; overflow-wrap: anywhere; }

/* guitar chord boxes */
.l3-g { display: block; color: var(--ink); }
.l3-g .gname { font-family: var(--f-display); font-weight: 800; font-size: 16px; fill: var(--ink); }
.l3-g .str { stroke: var(--muted); stroke-width: 1.3; }
.l3-g .fr { stroke: var(--line); stroke-width: 1.5; }
.l3-g .nut { stroke: var(--ink); stroke-width: 5; stroke-linecap: square; }
.l3-g .dot { fill: var(--accent); }
.l3-g .fing { font-family: var(--f-mono); font-weight: 700; font-size: 10px; fill: var(--accent-ink); }
.l3-g .open { fill: none; stroke: var(--ink); stroke-width: 1.4; }
.l3-g .mk { font-family: var(--f-mono); font-size: 13px; fill: var(--muted); }
.l3-g .gnote { font-family: var(--f-mono); font-size: 9px; fill: var(--muted); }
.l3-gboxes { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 8px; }
.l3-gbox { padding: 4px 2px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--surface); min-width: 0; }
.l3-gbox:hover { border-color: var(--accent); }
.l3-gbox[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.l3-gbox .l3-g { width: 100%; max-width: 120px; height: auto; margin: 0 auto; }
.q-art .l3-g { width: 110px; height: auto; }
.l3-gdetail { margin-top: 10px; }

/* piano shape */
.l3-pshape { display: flex; flex-wrap: wrap; gap: 12px 16px; align-items: center; }
.l3-pshape-k { overflow-x: auto; max-width: 100%; }
.l3-pshape-t { flex: 1 1 220px; display: grid; gap: 8px; min-width: 0; }
.l3-keys { display: block; max-width: 100%; height: auto; }
.l3-keys .w { fill: var(--key-w); stroke: var(--key-w-edge); stroke-width: 1; }
.l3-keys .b { fill: var(--key-b); stroke: var(--key-b); }
.l3-keys .w.on { fill: var(--glow); stroke: var(--key-w-edge); }
.l3-keys .b.on { fill: var(--glow); stroke: var(--key-b); }
.l3-keys .kl { font-family: var(--f-mono); font-size: 10px; font-weight: 700; fill: var(--ink); }

/* tables: row headers hold chord symbols and names, so no capitals */
.l3-tbl tbody th { font-family: var(--f-body); font-size: 15px; font-weight: 700; letter-spacing: 0; text-transform: none; color: var(--ink); }
.l3-tbl tbody th small { display: block; font-weight: 400; font-size: 13px; color: var(--muted); white-space: nowrap; }
.l3-tight th, .l3-tight td { padding: 7px 8px; }
.l3-tight td { white-space: nowrap; }
.l3-tight td:last-child { white-space: normal; min-width: 5.5em; }

/* compact tables (Roman numerals) */
.l3-rn th, .l3-rn td { padding: 6px 5px; text-align: center; white-space: nowrap; }
.l3-rn tbody th { text-align: left; font-family: var(--f-body); font-size: 14px; letter-spacing: 0; text-transform: none; color: var(--ink); font-weight: 700; }
.l3-rn thead th { font-size: 13px; text-transform: none; letter-spacing: 0; color: var(--accent); font-weight: 700; }

/* 3.H harmonizer */
.l3-field select { min-height: 44px; padding: 8px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font: inherit; width: 100%; max-width: 360px; }
.l3-nbars { gap: 8px; }
.l3-nbars .choice { min-width: 48px; }
.l3-key { font-size: 15px; color: var(--muted); max-width: 64ch; }
.l3-key b { color: var(--ink); }
.l3-bars { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 220px), 1fr)); gap: 10px; }
.l3-bar { display: grid; gap: 8px; padding: 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface-2); min-width: 0; }
.l3-bar-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.l3-bar-notes { font-family: var(--f-mono); font-size: 14px; color: var(--muted); overflow-wrap: anywhere; }
.l3-bar-notes b { color: var(--ink); text-decoration: underline; text-decoration-color: var(--glow); text-decoration-thickness: 3px; text-underline-offset: 3px; }
.l3-opts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.l3-opt { display: grid; justify-items: center; gap: 0; min-height: 56px; padding: 6px 4px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--surface); line-height: 1.2; min-width: 0; }
.l3-opt b { font-family: var(--f-display); font-size: 18px; }
.l3-opt span { font-family: var(--f-mono); font-size: 13px; }
.l3-opt small { font-size: 11px; font-weight: 700; color: var(--glow); min-height: 1.2em; }
.l3-opt.fits { border-color: var(--glow); }
.l3-opt[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.l3-opt[aria-pressed="true"] small { color: var(--accent-ink); }

@media (max-width: 520px) {
  .l3-first { grid-template-columns: minmax(0, 1fr) auto; gap: 8px; }
  .l3-fig .l3-g { width: 80px; }
  .l3-namer { padding: 10px 12px; }
}

/* ---------- Level 4: the clock ---------- */

/* circle beside its panel; stacked on phones */
.l4-split { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 20px; align-items: center; }
@media (max-width: 720px) {
  .l4-split { grid-template-columns: minmax(0, 1fr); gap: 12px; }
  /* in play tasks the prompt comes first on a phone; the clock follows as the map */
  .l4-split.l4-taskfirst > .l4-circle { order: 2; }
  .l4-split.l4-taskfirst .l4-circle .circle5 { max-width: 300px; }
}
.l4-circle { min-width: 0; }
.l4-circle .circle5 { max-width: 380px; }
.l4-split .l4-circle .circle5 { max-width: 360px; }
.art .l4-circle .circle5 { margin: 0; }
.l4-qcircle .circle5 { max-width: 260px; margin: 0; }
.l4-info { display: grid; gap: 8px; align-content: start; min-width: 0; }
.l4-info h3 { font-size: 22px; }
.l4-staff { overflow-x: auto; }
.l4-staff .nstaff { width: 100%; max-width: 400px; height: auto; }
.l4-walk, .l4-chords { display: grid; gap: 14px; min-width: 0; align-content: start; }

/* key signatures drawn at one size, whatever their width */
.l4-sig { min-width: 0; }
.l4-sig .nstaff, .art .l4-sig .nstaff, .q-art .l4-sig .nstaff { width: auto; height: 120px; max-width: 100%; }
.l4-sig.grand .nstaff, .art .l4-sig.grand .nstaff { height: 230px; }

/* captioned pictures side by side */
.l4-figs { display: flex; flex-wrap: wrap; gap: 12px 28px; align-items: flex-end; }
.l4-figs figure { margin: 0; display: grid; gap: 4px; justify-items: start; min-width: 0; max-width: 100%; }
.l4-figs figcaption { font-size: 13px; color: var(--muted); }
.hook + .hook { margin-top: -2px; }

/* play-the-tonic task */
.l4-keytask { display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: center; }
.l4-keyside { display: grid; gap: 10px; }
.l4-ask { font-family: var(--f-display); font-weight: 800; font-size: 26px; line-height: 1.15; }

/* fill the clock */
.l4-clockbar { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; }
.l4-clockbar .chip { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.l4-clock .circle5 { max-width: 400px; }
.l4-clock .circle5 .hubtxt { font-size: 26px; }
.l4-clock .circle5 .hubtxt.sub { font-size: 13px; }
.l4-hide-minor .wedge.minor:not(.ok) .mname { visibility: hidden; }

/* the family slice as a 3 × 2 grid: IV I V over ii vi iii */
.l4-six { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; max-width: 340px; }
.l4-six div { display: grid; justify-items: center; gap: 2px; padding: 8px 4px; border-radius: 10px; background: var(--glow-soft); min-width: 0; }
.l4-six div.in { background: var(--surface-2); }
.l4-six span { font-family: var(--f-mono); font-size: 12px; color: var(--muted); }
.l4-six b { font-family: var(--f-display); font-size: 20px; line-height: 1.1; }

/* minor mood */
.l4-mood { display: grid; gap: 12px; }
.l4-line { display: grid; gap: 4px; }
.notes-strip .n.l4-was { box-shadow: inset 0 -3px 0 var(--glow); }
.notes-strip .n.l4-flip { border: 0; font: inherit; font-family: var(--f-mono); font-weight: 700; background: var(--glow-soft); color: var(--ink); box-shadow: inset 0 0 0 2px var(--glow); }
.notes-strip .n.l4-flip.undone { background: var(--surface-2); color: var(--muted); box-shadow: inset 0 0 0 1.5px var(--line); }
.l4-chordline { font-family: var(--f-mono); font-size: 14px; color: var(--muted); }

/* ---------- Level 5: progressions, the backing loop, chord-tone radar, dynamics, form ---------- */

/* every Level 5 task lays out its parts with even gaps; pictures and widgets under a card's text get room */
.l5-task { display: grid; gap: 12px; min-width: 0; }
.l5-tsd, .l5-svg, .l5-form:first-child, .art > .l5-cells, .art > .nstaff, .widget > .l5-btns, .widget > .l5-cx, .widget > .choices, .widget > .l5-loop { margin-top: 12px; }
.widget > .l5-songs, .widget > .l5-note { margin-top: 8px; }
.l5-nw { white-space: nowrap; }

/* chord cells: a numeral over its chord name */
.l5-prog { display: grid; gap: 8px; }
.l5-keyname { font-family: var(--f-mono); font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.l5-cells { display: flex; flex-wrap: wrap; gap: 6px; }
.l5-cells.l5-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); }
.l5-cell { display: grid; justify-items: center; align-content: start; min-width: 58px; padding: 6px 8px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--surface); min-height: 52px; }
.l5-cell b { font-family: var(--f-display); font-weight: 800; font-size: 18px; line-height: 1.2; }
.l5-cell span { font-family: var(--f-mono); font-size: 12px; color: var(--muted); }
.l5-cell small { font-family: var(--f-mono); font-size: 10px; color: var(--muted); justify-self: start; line-height: 1; }
.l5-cell em { font-style: normal; font-size: 11px; font-weight: 700; color: var(--glow); text-align: center; line-height: 1.2; }
.l5-cell.cur { border-color: var(--glow); box-shadow: inset 0 0 0 1px var(--glow); }
.l5-cell.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.l5-cell.on span, .l5-cell.on small { color: var(--accent-ink); }
.l5-cell.ok { background: var(--good-soft); border-color: var(--good); }
.l5-cell.ok b, .l5-cell.ok span { color: var(--good); }
.l5-cell.no { background: var(--bad-soft); border-color: var(--bad); }
.l5-cell.no b, .l5-cell.no span { color: var(--bad); }
.l5-cell.l5-empty { border-style: dashed; color: var(--muted); }
.l5-half { grid-column: 1 / -1; font-family: var(--f-mono); font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); margin-top: 4px; }
.l5-follow { display: grid; gap: 12px; }
.l5-follow .big-name { font-size: clamp(40px, 10vw, 76px); overflow-wrap: anywhere; }
.l5-art .circle5 { max-width: 300px; margin: 0; }

/* the backing loop */
.l5-loop { display: grid; gap: 10px; padding: 14px; border-radius: 12px; background: var(--surface-2); min-width: 0; }
.l5-loop .l5-cell { background: var(--surface); }
.l5-loop .l5-cell.on { background: var(--accent); }
.l5-now { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; min-height: 48px; }
.l5-now-num { font-family: var(--f-display); font-weight: 800; font-size: 44px; line-height: 1; }
.l5-now-sym { font-family: var(--f-mono); font-size: 20px; color: var(--muted); }
.l5-beats { display: flex; gap: 6px; margin-left: auto; align-self: center; }
.l5-beats i { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--line); background: var(--surface); }
.l5-beats i:first-child { width: 18px; height: 18px; }
.l5-beats i.lit { background: var(--glow); border-color: var(--glow); }
.l5-tempo { display: inline-flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 14px; font-weight: 700; color: var(--muted); }
.l5-tempo input { width: min(100%, 150px); }
.l5-note { font-size: 14px; color: var(--muted); }
.l5-songs { font-size: 15px; }

/* radar: legend, tally, the trail of notes, and the dock keys as they light */
.l5-tally { display: flex; flex-wrap: wrap; gap: 6px; }
.l5-t { display: inline-flex; align-items: baseline; gap: 4px; padding: 4px 10px; border-radius: 999px; font-size: 13px; font-weight: 700; background: var(--surface-2); color: var(--muted); }
.l5-t b { font-family: var(--f-display); font-size: 16px; }
.l5-t.ct { background: var(--good-soft); color: var(--good); }
.l5-t.inkey { background: var(--accent-soft); color: var(--accent); }
.l5-t.out { background: var(--bad-soft); color: var(--bad); }
.notes-strip .n.ct { background: var(--good-soft); color: var(--good); }
.notes-strip .n.inkey { background: var(--accent-soft); color: var(--accent); }
.notes-strip .n.out { background: var(--bad-soft); color: var(--bad); }
.key.l5-hit-ct.w { background: var(--good-soft); }
.key.l5-hit-ct.b { background: var(--good); }
.key.l5-hit-inkey.w { background: var(--accent-soft); }
.key.l5-hit-inkey.b { background: var(--accent); }
.key.l5-hit-out.w { background: var(--bad-soft); }
.key.l5-hit-out.b { background: var(--bad); }

/* function diagram, forms, button rows */
.l5-tsd { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr) auto minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: 4px; max-width: 460px; }
.l5-f { display: grid; justify-items: center; padding: 8px 4px; border-radius: 10px; background: var(--surface-2); font-size: 13px; line-height: 1.3; color: var(--muted); min-width: 0; }
.l5-f b { font-family: var(--f-display); font-weight: 800; font-size: 24px; line-height: 1.1; color: var(--ink); }
.l5-f.t { background: var(--good-soft); }
.l5-f.s { background: var(--accent-soft); }
.l5-f.d { background: var(--glow-soft); }
.l5-arrow { color: var(--muted); font-weight: 700; }
.l5-btns { display: flex; flex-wrap: wrap; gap: 8px; }
.l5-form { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; margin-bottom: 8px; }
.l5-form span { padding: 6px 12px; border-radius: 8px; font-weight: 700; font-size: 14px; }
.l5-form .l5-form-l { font-family: var(--f-mono); font-size: 12px; font-weight: 500; color: var(--muted); padding-left: 0; min-width: 48px; }
.l5-form .a { background: var(--accent-soft); color: var(--accent); }
.l5-form .b { background: var(--glow-soft); color: var(--glow); }
.l5-form .c { background: var(--good-soft); color: var(--good); }

/* dynamics, articulation and repeat-sign pictures */
.l5-it { font-family: Georgia, 'Times New Roman', serif; font-style: italic; font-weight: 700; }
.l5-svg, .art svg.l5-svg, .q-art svg.l5-svg { display: block; width: 100%; max-width: 520px; height: auto; }
.l5-svg line, .l5-svg path { stroke: var(--ink); stroke-width: 1.6; fill: none; }
.l5-svg .thin { stroke-width: 1; opacity: 0.7; }
.l5-svg .fill { fill: var(--ink); stroke: none; }
.l5-svg text { fill: var(--ink); font-family: var(--f-mono); font-size: 12px; }
.l5-svg text.dyn { font-family: Georgia, 'Times New Roman', serif; font-style: italic; font-weight: 700; font-size: 22px; }
.l5-cresc { display: grid; grid-template-columns: repeat(20, minmax(0, 1fr)); gap: 3px; align-items: end; height: 96px; padding: 6px; border-radius: 10px; background: var(--surface-2); }
.l5-cresc i { display: block; height: 100%; background: var(--accent); border-radius: 3px 3px 0 0; transform-origin: bottom; transform: scaleY(0.02); transition: transform .06s; }
.l5-order { display: flex; flex-wrap: wrap; gap: 6px; }
.l5-order span { display: grid; place-items: center; min-width: 54px; min-height: 44px; border-radius: 10px; border: 1.5px dashed var(--line); font-size: 20px; }
.l5-order span.ok { border-style: solid; border-color: var(--good); background: var(--good-soft); color: var(--good); }

/* circle explorer */
.l5-cx { display: grid; grid-template-columns: minmax(0, 360px) minmax(0, 1fr); gap: 16px; align-items: center; }
.l5-cx-side { display: grid; gap: 10px; }
@media (max-width: 640px) { .l5-cx { grid-template-columns: minmax(0, 1fr); } }

/* the 8-bar piece */
.l5-opt { display: grid; gap: 6px; }
.l5-seed select { min-height: 40px; padding: 6px 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font: inherit; max-width: 100%; }
.l5-piece-bars { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.l5-bar { display: grid; gap: 4px; align-content: start; padding: 6px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--surface); min-height: 86px; min-width: 0; }
.l5-bar.on { border-color: var(--glow); box-shadow: inset 0 0 0 1px var(--glow); }
.l5-bar-h { display: flex; align-items: baseline; gap: 6px; flex-wrap: wrap; }
.l5-bar-h small { font-family: var(--f-mono); font-size: 10px; color: var(--muted); }
.l5-bar-h b { font-family: var(--f-display); font-weight: 800; font-size: 16px; }
.l5-bar-h span { font-family: var(--f-mono); font-size: 12px; color: var(--muted); }
.l5-bar-n { display: flex; flex-wrap: wrap; gap: 3px; }
.l5-bar-n .n { font-family: var(--f-mono); font-size: 11px; font-weight: 700; padding: 2px 5px; border-radius: 6px; }
.l5-bar-n .n.ct { background: var(--good-soft); color: var(--good); }
.l5-bar-n .n.inkey { background: var(--accent-soft); color: var(--accent); }
.l5-bar-n .n.out { background: var(--bad-soft); color: var(--bad); }
.l5-checks { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; font-size: 14px; color: var(--muted); }
.l5-checks li.ok { color: var(--good); font-weight: 700; }
@media (max-width: 520px) {
  .l5-cell { min-width: 50px; padding: 5px 6px; }
  .l5-now-num { font-size: 36px; }
  .l5-bar { padding: 5px 4px; }
  .l5-bar-h b { font-size: 14px; }
}

/* ---------- Toolbox ---------- */
.tools { display: grid; gap: 16px; }
.tools h1 { font-size: clamp(24px, 4vw, 32px); }
.tool-tabs { display: flex; flex-wrap: wrap; gap: 6px; }
.tool-tabs button { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 8px 14px; font-weight: 700; font-size: 14px; color: var(--muted); }
.tool-tabs button[aria-current="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.tool-body { display: grid; gap: 14px; min-width: 0; }
.tool-body h2 { font-size: 24px; }
.tool-out { display: grid; gap: 12px; min-width: 0; }
.tool-controls { align-items: flex-end; }
.sel { display: grid; gap: 4px; font-size: 13px; color: var(--muted); font-weight: 700; }
.sel select, .sel input[type="range"] { min-height: 40px; }
.sel select { padding: 6px 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font: inherit; font-weight: 700; min-width: 120px; }
.muted { color: var(--muted); }
.tools .tbl th { width: 1%; white-space: nowrap; padding-right: 24px; }
.small { font-size: 14px; font-weight: 500; }
.lead { color: var(--muted); max-width: 62ch; }

.listen-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.listen-card { padding: 16px; border-radius: 12px; background: var(--surface-2); min-width: 0; display: grid; gap: 4px; }
.listen-card .big-name { font-size: clamp(44px, 9vw, 72px); overflow-wrap: anywhere; }
.trail-wrap { display: grid; gap: 6px; }
.notes-strip .n.chord { background: var(--glow-soft); color: var(--glow); }

.tool-circle { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 20px; align-items: start; }

<script>
/* ------------------------------------------------------------------
   Motif · listening engine
   Pitch: McLeod Pitch Method (McLeod & Wyvill, "A Smarter Way to Find
   Pitch", 2005). Normalized square difference function (NSDF), key
   maxima, k-threshold, parabolic interpolation.
   Chords: spectral-peak chroma and harmonic templates (further down).
   ------------------------------------------------------------------ */

function freqToMidi(f) { return 69 + 12 * Math.log2(f / 440); }
function midiToFreq(m) { return 440 * Math.pow(2, (m - 69) / 12); }

function createPitchDetector(sampleRate, size, opts) {
  opts = opts || {};
  const minHz = opts.minHz || 60;
  const maxHz = opts.maxHz || 1500;
  const k = opts.k || 0.9;
  const maxLag = Math.min(size - 3, Math.floor(sampleRate / minHz));
  const minLag = Math.max(2, Math.floor(sampleRate / maxHz));
  const x = new Float32Array(size);
  const nsdf = new Float32Array(maxLag + 3);

  return function detect(input) {
    const n = Math.min(size, input.length);
    let mean = 0;
    for (let i = 0; i < n; i++) mean += input[i];
    mean /= n;
    let energy = 0;
    for (let i = 0; i < n; i++) { const v = input[i] - mean; x[i] = v; energy += v * v; }
    const rms = Math.sqrt(energy / n);
    if (rms < 1e-4) return { freq: 0, clarity: 0, rms: rms };

    for (let tau = 0; tau <= maxLag + 1; tau++) {
      let acf = 0, m = 0;
      const lim = n - tau;
      for (let j = 0; j < lim; j++) {
        const a = x[j], b = x[j + tau];
        acf += a * b;
        m += a * a + b * b;
      }
      nsdf[tau] = m > 0 ? (2 * acf) / m : 0;
    }

    // Skip the positive lobe around lag 0, then collect one key maximum per positive lobe.
    let tau = 1;
    while (tau <= maxLag && nsdf[tau] > 0) tau++;
    const peaks = [];
    let best = -1, bestIdx = -1, inPos = false;
    for (; tau <= maxLag; tau++) {
      const v = nsdf[tau];
      if (v > 0) {
        inPos = true;
        if (v > best) { best = v; bestIdx = tau; }
      } else if (inPos) {
        peaks.push(bestIdx);
        inPos = false;
        best = -1;
      }
    }
    if (inPos && bestIdx > 0 && bestIdx < maxLag) peaks.push(bestIdx);

    let top = 0;
    for (let i = 0; i < peaks.length; i++) {
      const p = peaks[i];
      if (p >= minLag && nsdf[p] > top) top = nsdf[p];
    }
    if (top <= 0) return { freq: 0, clarity: 0, rms: rms };

    const thr = k * top;
    let chosen = -1;
    for (let i = 0; i < peaks.length; i++) {
      const p = peaks[i];
      if (p >= minLag && nsdf[p] >= thr) { chosen = p; break; }
    }
    if (chosen < 1) return { freq: 0, clarity: 0, rms: rms };

    const a = nsdf[chosen - 1], b = nsdf[chosen], c = nsdf[chosen + 1];
    const den = a - 2 * b + c;
    let shift = 0, clarity = b;
    if (den !== 0) {
      shift = 0.5 * (a - c) / den;
      clarity = b - 0.25 * (a - c) * shift;
    }
    return { freq: sampleRate / (chosen + shift), clarity: Math.min(1, clarity), rms: rms };
  };
}

/* Turns a stream of pitch readings into note-on / note-off events.
   A note must hold for `need` readings; it is released after `release`
   readings of silence. Hysteresis keeps a wobbly voice on one note. */
function createNoteTracker(opts) {
  opts = opts || {};
  const need = opts.need || 3;
  const release = opts.release || 4;
  const minClarity = opts.minClarity || 0.88;
  let cand = null, candCount = 0, held = null, miss = 0;

  function update(r, gateOpen) {
    const out = { on: null, off: null, midiFloat: null };
    const ok = gateOpen && r.freq > 0 && r.clarity >= minClarity;
    if (ok) {
      const mf = freqToMidi(r.freq);
      out.midiFloat = mf;
      const m = (held !== null && Math.abs(mf - held) < 0.65) ? held : Math.round(mf);
      miss = 0;
      if (m === cand) candCount++; else { cand = m; candCount = 1; }
      if (candCount >= need && m !== held) {
        if (held !== null) out.off = held;
        held = m;
        out.on = m;
      }
    } else {
      miss++;
      cand = null;
      candCount = 0;
      if (held !== null && miss >= release) { out.off = held; held = null; }
    }
    return out;
  }
  function reset() {
    const prev = held;
    held = null; cand = null; candCount = 0; miss = 0;
    return prev;
  }
  return { update: update, reset: reset };
}

/* Onset (clap, strike) detector on frame loudness. */
function createOnsetDetector(opts) {
  opts = opts || {};
  const refractory = opts.refractory || 0.11;
  const gate = opts.gate || 0.02;
  const ratio = opts.ratio || 1.8;
  let slow = 0, prev = 0, last = -1;
  return function (rms, t) {
    const hit = rms > gate && rms > prev * ratio && rms > slow * ratio && (t - last) > refractory;
    slow = slow * 0.95 + rms * 0.05;
    prev = rms;
    if (hit) { last = t; return true; }
    return false;
  };
}

/* ------------------------------------------------------------------
   Chords: chroma from the spectral peaks of an AnalyserNode frame
   (getFloatFrequencyData: Blackman window, dB), matched against harmonic
   chord templates (Gómez 2006: each tone plus harmonics 1–6 with decaying
   weight) by cosine similarity. Overtones are the enemy: a lone C3 also
   sounds G and E, a power chord also sounds the 9th. So peaks that sit on
   another peak's harmonic series count less, and a chord tone that could be
   another chord tone's overtone must be stronger to count.
   ------------------------------------------------------------------ */

const CHORD_QUALITIES = [
  ['maj', [0, 4, 7]], ['min', [0, 3, 7]], ['dim', [0, 3, 6]], ['aug', [0, 4, 8]],
  ['sus2', [0, 2, 7]], ['sus4', [0, 5, 7]],
  ['7', [0, 4, 7, 10]], ['maj7', [0, 4, 7, 11]], ['m7', [0, 3, 7, 10]]
];
const CHORD_HARM_PC = [0, 0, 7, 0, 4, 7];   // round(12*log2(h)) mod 12, h = 1..6
let chordPkHz = new Float64Array(512), chordPkDb = new Float64Array(512);
let chordPkLvl = new Float64Array(512), chordPkSlope = new Float64Array(512), chordPkRef = new Uint8Array(512);
const chordAdj = new Float64Array(CHORD_QUALITIES.length * 12), chordRaw = new Float64Array(CHORD_QUALITIES.length * 12);

function chordMask(root, quality) {
  for (let q = 0; q < CHORD_QUALITIES.length; q++) {
    if (CHORD_QUALITIES[q][0] !== quality) continue;
    let m = 0;
    CHORD_QUALITIES[q][1].forEach(iv => { m |= 1 << ((root + iv) % 12); });
    return m;
  }
  return 0;
}

/* Index of the peak within 30 cents of f and at least minDb loud, or -1. */
function chordPeakNear(pkHz, pkDb, n, minDb, f) {
  for (let j = 0; j < n; j++) {
    if (pkDb[j] < minDb) continue;
    const c = 1200 * Math.log2(pkHz[j] / f);
    if (c > 30) break;
    if (c > -30) return j;
  }
  return -1;
}

/* One analyser frame (dB per bin) -> { chroma, bassPc, energy, peaks, played }
   or null when the frame is quiet or has too few peaks.
   chroma: Float32Array(12), max 1. bassPc: 0–11 or -1. energy: summed power
   of the peaks used. peaks: how many. played: 12-bit mask of pitch classes
   with a peak that is no harmonic of a lower peak (surely a played note);
   pass it on to matchChord with bassPc. Only local maxima count, so the
   noise floor and window sidelobes never reach the chroma. */
function analyzeSpectrum(db, sampleRate, fftSize, opts) {
  opts = opts || {};
  const floorDb = opts.floorDb != null ? opts.floorDb : -90;
  const rangeDb = opts.rangeDb || 45;
  const minTopDb = opts.minTopDb != null ? opts.minTopDb : -80;
  const minPeaks = opts.minPeaks || 3;
  const bassDb = opts.bassDb || 20;
  const compress = opts.compress || 0.65;
  const ot = opts.overtone != null ? opts.overtone : 0.5;
  const otDb = opts.overtoneDb != null ? opts.overtoneDb : -3;
  const binHz = sampleRate / fftSize;
  const lo = Math.max(1, Math.floor((opts.minHz || 55) / binHz));
  const hi = Math.min(db.length - 2, Math.ceil((opts.maxHz || 2100) / binHz));
  if (chordPkHz.length < hi - lo) {
    chordPkHz = new Float64Array(hi - lo); chordPkDb = new Float64Array(hi - lo);
    chordPkLvl = new Float64Array(hi - lo); chordPkSlope = new Float64Array(hi - lo); chordPkRef = new Uint8Array(hi - lo);
  }
  const pkHz = chordPkHz, pkDb = chordPkDb, pkLvl = chordPkLvl, pkSlope = chordPkSlope, pkRef = chordPkRef;

  // Local maxima, refined by a parabola through the three dB values.
  let n = 0, top = -Infinity;
  for (let k = lo; k <= hi; k++) {
    const b = db[k];
    if (!(b > floorDb && b > db[k - 1] && b >= db[k + 1])) continue;
    const a = db[k - 1], c = db[k + 1];
    let d = 0, p = b;
    if (a > -Infinity && c > -Infinity) {
      const den = a - 2 * b + c;
      if (den < 0) { d = 0.5 * (a - c) / den; p = b - 0.25 * (a - c) * d; }
    }
    pkHz[n] = (k + d) * binHz;
    pkDb[n] = p;
    n++;
    if (p > top) top = p;
  }
  if (n < minPeaks || top < minTopDb) return null;
  const thr = Math.max(floorDb, top - rangeDb);

  // Envelope of the series each peak would start: its loudest octave partial
  // among f, 2f, 4f (a piano's fundamental can sit under its 2nd partial, and
  // two notes an octave apart can cancel in one bin), falling by the darker
  // of the f->2f and 2f->4f steps, in dB per octave, clamped to [-24, 0].
  const tolLo = Math.pow(2, -30 / 1200), tolHi = Math.pow(2, 30 / 1200);
  const stretchHi = Math.pow(2, 60 / 1200);   // stiff strings run sharp
  for (let j = 0, k = 0, k4 = 0; j < n; j++) {
    while (k < n && pkHz[k] < 2 * tolLo * pkHz[j]) k++;
    while (k4 < n && pkHz[k4] < 4 * tolLo * pkHz[j]) k4++;
    const o2 = (k < n && pkHz[k] < 2 * tolHi * pkHz[j]) ? pkDb[k] : thr;
    const o4 = (k4 < n && pkHz[k4] < 4 * tolHi * pkHz[j]) ? pkDb[k4] : thr;
    const lv = Math.max(pkDb[j], o2, o4);
    pkLvl[j] = lv;
    pkSlope[j] = Math.max(-24, Math.min(0, o2 - pkDb[j], o4 - o2));
    pkRef[j] = lv === pkDb[j] ? 0 : lv === o2 ? 1 : 2;
  }

  // Each peak adds its linear magnitude to the nearest pitch class: full
  // weight within 25 cents, raised-cosine fade to zero at 45 cents. A peak at
  // h = 3, 5, 6, 7... times a lower peak, and no louder than that series'
  // envelope predicts (+ overtoneDb), may be just an overtone: it counts
  // `overtone` times, back to full over the next 4 dB (a played G4 over a
  // flute-like C3 is far louder than C3's envelope allows). Once a pitch class
  // has a peak on nobody's harmonic series it is played, and its later peaks
  // count in full.
  const chroma = new Float32Array(12);
  let used = 0, energy = 0, played = 0;
  for (let i = 0; i < n; i++) {
    if (pkDb[i] < thr) continue;
    used++;
    const lin = Math.pow(10, pkDb[i] / 20);
    energy += lin * lin;
    const m = 69 + 12 * Math.log2(pkHz[i] / 440);
    const r = Math.round(m);
    const dc = Math.abs(m - r) * 100;
    if (dc >= 45) continue;
    const pc = ((r % 12) + 12) % 12;
    let g = 1, harm = false;
    for (let j = 0; j < i && g > ot && !(played >> pc & 1); j++) {
      const q = pkHz[i] / pkHz[j];
      if (q > 16.5) continue;
      if (q < 1.9) break;
      const h = Math.round(q);
      if (pkDb[j] < thr || q < h * tolLo || q > h * stretchHi) continue;
      harm = true;
      if ((h & (h - 1)) === 0) continue;   // octaves keep the pitch class
      const ex = (pkDb[i] - (pkLvl[j] + pkSlope[j] * (Math.log2(h) - pkRef[j]) + otDb)) / 4;
      const gj = ex <= 0 ? ot : ex >= 1 ? 1 : ot + (1 - ot) * ex;
      if (gj < g) g = gj;
    }
    if (!harm && pkDb[i] >= top - 30) played |= 1 << pc;
    chroma[pc] += g * (dc <= 25 ? 1 : Math.pow(Math.cos(Math.PI * (dc - 25) / 40), 2)) * lin;
  }
  if (used < minPeaks) return null;
  // Compress the sums so a tripled root does not drown a single third.
  let max = 0;
  for (let i = 0; i < 12; i++) { chroma[i] = Math.pow(chroma[i], compress); if (chroma[i] > max) max = chroma[i]; }
  if (max <= 0) return null;
  for (let i = 0; i < 12; i++) chroma[i] /= max;

  // Bass: lowest peak that is strong, or not far below and with a strong
  // octave (a piano or a small mic can leave the fundamental well under the
  // 2nd harmonic). A peak that is the 3rd partial of real but weaker peaks
  // at f/3 and 2f/3 yields to f/3.
  const strong = top - bassDb, weak = top - 30;
  let bass = -1;
  for (let i = 0; i < n && bass < 0; i++) {
    if (pkDb[i] >= strong) bass = i;
    else if (pkDb[i] >= weak) { const j = chordPeakNear(pkHz, pkDb, n, weak, 2 * pkHz[i]); if (j >= 0 && pkDb[j] >= strong) bass = i; }
  }
  let bassPc = -1;
  if (bass >= 0) {
    let f = pkHz[bass];
    const j = chordPeakNear(pkHz, pkDb, n, weak, f / 3);
    if (j >= 0 && chordPeakNear(pkHz, pkDb, n, weak, 2 * f / 3) >= 0) f = pkHz[j];
    bassPc = ((Math.round(69 + 12 * Math.log2(f / 440)) % 12) + 12) % 12;
  }
  return { chroma: chroma, bassPc: bassPc, energy: energy, peaks: used, played: played };
}

/* Templates: each chord tone plus its harmonics 1–6 (weight decay^(h-1))
   folded onto pitch classes, unit length. Built for root C; roots rotate. */
let chordTpl = null, chordTplDecay = -1;
function chordTemplates(decay) {
  if (chordTpl && chordTplDecay === decay) return chordTpl;
  chordTpl = CHORD_QUALITIES.map(q => {
    const t = new Float64Array(12);
    q[1].forEach(iv => { for (let h = 0; h < 6; h++) t[(iv + CHORD_HARM_PC[h]) % 12] += Math.pow(decay, h); });
    let nn = 0;
    for (let i = 0; i < 12; i++) nn += t[i] * t[i];
    nn = Math.sqrt(nn);
    for (let i = 0; i < 12; i++) t[i] /= nn;
    const masks = new Uint16Array(12);
    for (let r = 0; r < 12; r++) masks[r] = chordMask(r, q[0]);
    return { name: q[0], ivs: q[1], t: t, masks: masks };
  });
  chordTplDecay = decay;
  return chordTpl;
}

/* Chroma -> best { root, quality, score, margin, pcs } or null.
   score: cosine similarity with the template. margin: lead over the next
   chord with a different pitch-class set (C+ = E+ = G♯+ and Csus2 = Gsus4
   are one set and do not count against each other). pcs: pitch classes at
   or above `active`. opts.bassPc and opts.played come from analyzeSpectrum;
   bassPc only breaks near-ties (sus2/sus4, aug, C6-like sets). */
function matchChord(chroma, opts) {
  opts = opts || {};
  const minScore = opts.minScore != null ? opts.minScore : 0.6;
  const active = opts.active || 0.3;
  const toneMin = opts.toneMin || 0.3;
  const need3 = opts.need3 || 0.7, need5 = opts.need5 || 0.55, need7 = opts.need7 || 0.4;
  const fifthMin = opts.fifthMin || 0.2;
  const minShare = opts.minShare != null ? opts.minShare : 0.6;
  const bassPc = opts.bassPc != null ? opts.bassPc : -1;
  const bassBonus = opts.bassBonus != null ? opts.bassBonus : 0.02;
  const played = opts.played || 0;
  const qualities = opts.qualities || null;
  const tpl = chordTemplates(opts.decay || 0.6);

  let max = 0, e2 = 0;
  for (let i = 0; i < 12; i++) if (chroma[i] > max) max = chroma[i];
  if (!(max > 0)) return null;
  const pcs = [];
  for (let i = 0; i < 12; i++) {
    e2 += chroma[i] * chroma[i];
    if (chroma[i] >= active * max) pcs.push(i);
  }
  if (pcs.length < 3) return null;
  const nn = Math.sqrt(e2);

  const n = tpl.length * 12, adj = chordAdj, raw = chordRaw;
  for (let q = 0; q < tpl.length; q++) {
    const skip = qualities && qualities.indexOf(tpl[q].name) < 0, t = tpl[q].t;
    for (let r = 0; r < 12; r++) {
      const k = q * 12 + r;
      if (skip) { adj[k] = -Infinity; continue; }
      let dot = 0;
      for (let i = 0; i < 12; i++) dot += chroma[(i + r) % 12] * t[i];
      raw[k] = dot / nn;
      adj[k] = raw[k] + (r === bassPc ? bassBonus : 0);
    }
  }

  // Take the best-scoring candidate whose tones are all clearly there. A tone
  // that is not surely played but sits a fifth, a major third or a minor
  // seventh above another chord tone could be that tone's 3rd, 5th or 7th
  // harmonic, so it must be stronger: this keeps a power chord from passing
  // as sus2 and C (with E's 3rd harmonic B) from passing as Cmaj7. The fifth
  // over the root of a non-sus chord only has to be present: it tells the
  // least and often hides in the root's own 3rd harmonic. Then the chord
  // tones must hold most of the chroma energy (noise spreads it out).
  for (let tries = 0; tries < 8; tries++) {
    let k = -1;
    for (let i = 0; i < n; i++) if (adj[i] > -Infinity && (k < 0 || adj[i] > adj[k] + 1e-9)) k = i;
    if (k < 0 || raw[k] < minScore) return null;
    const r = k % 12, ivs = tpl[(k / 12) | 0].ivs, sus = ivs[1] === 2 || ivs[1] === 5;
    let ok = true, share = 0;
    for (let a = 0; a < ivs.length && ok; a++) {
      const pc = (r + ivs[a]) % 12, v = chroma[pc];
      let need = toneMin;
      if (ivs[a] === 7 && !sus) need = fifthMin;
      else if (!(played >> pc & 1)) {
        for (let b = 0; b < ivs.length; b++) {
          const d = (ivs[a] - ivs[b] + 12) % 12;
          need = Math.max(need, d === 7 ? need3 : d === 4 ? need5 : d === 10 ? need7 : 0);
        }
      }
      share += v * v;
      if (v < need * max) ok = false;
    }
    if (!ok || share < minShare * e2) { adj[k] = -Infinity; continue; }
    const mk = tpl[(k / 12) | 0].masks[r];
    let second = 0;
    for (let i = 0; i < n; i++) if (adj[i] > second && tpl[(i / 12) | 0].masks[i % 12] !== mk) second = adj[i];
    return { root: r, quality: tpl[(k / 12) | 0].name, score: raw[k], margin: adj[k] - second, pcs: pcs };
  }
  return null;
}

/* Turns a stream of matchChord results into chord-on / chord-off events.
   A chord must win `need` frames in a row to start and is released after
   `release` frames of silence or other chords. Hysteresis: once held, a
   frame of the same chord down to `keepScore` still counts. */
function createChordTracker(opts) {
  opts = opts || {};
  const need = opts.need || 6;
