  <section class="panel">
    <div class="level-head"><div><div class="eyebrow">Level ${shown.n} of ${LEVELS.length}</div><h2>${shown.title}</h2><p class="tagline">${shown.tagline || ''}</p></div>${chip}</div>
    ${open ? '' : `<div class="locked-note"><span>Pass the Level ${shown.n - 1} boss to open this level. Already know Level ${shown.n - 1}? The boss is also the way to test out.</span><button type="button" class="btn small" data-boss="${shown.n - 1}">Level ${shown.n - 1} boss</button></div>`}

function renderLesson(id) {
  const u = unitById(id);
  runLesson(u, view, unit => showComplete(unit), () => go('home'));
}
function showComplete(unit) {
  const lv = levelByN(unit.level), after = levelByN(unit.level + 1);
  const nx = nextUnit(unit.level) || (unit.boss && after ? after.units[0] : null);
  const cards = (CARD_DEFS[unit.id] || []).length;
  const last = unit.boss && !after;
  const big = unit.boss ? (last ? 'Beginner section complete.' : `Level ${unit.level} passed.`) : unit.title + ': done.';
  const body = cards ? `${cards} review card${cards > 1 ? 's' : ''} joined your deck. They come back on a growing schedule: tomorrow, then 3, 7, 14 and 30 days.` : (unit.doneText || (unit.create ? 'Saved to your sketchbook.' : 'Nice work.'));
  const pass = unit.boss ? `<p>${lv.passText || ''}${after ? ` Level ${after.n}, <b>${after.title}</b>, is open.` : ''}</p>` : '';
  view.innerHTML = `<section class="panel done-card"><div class="eyebrow">${unit.boss ? 'Level ' + unit.level : unit.create ? 'Create' : 'Unit ' + unit.id} complete</div><div class="big">${big}</div><p>${body}</p>${pass}<div class="row">${nx ? `<button type="button" class="btn primary" data-act="next">${nx.boss ? 'Level ' + nx.level + ' boss' : 'Next: ' + nx.title}</button>` : ''}<button type="button" class="btn" data-act="home">Level ${nx ? nx.level : unit.level} path</button></div></section>`;
  const nb = view.querySelector('[data-act="next"]'); if (nb) nb.onclick = () => go('lesson', nx.id);
  view.querySelector('[data-act="home"]').onclick = () => go('home', nx ? nx.level : unit.level);
  paintStreak();
}

/* ---------- Daily Set ---------- */
const DAILY = ['Tune-in', 'Review', 'New bite', 'Create', 'Ear spark', 'Today’s 1%'];
function renderDaily() {
  let s = 0;
  view.innerHTML = `<section class="panel"><div class="lesson-head"><div><div class="eyebrow">Daily Set · about 10 minutes</div><h1>Today’s practice</h1></div><button type="button" class="btn ghost small" data-act="exit">← Home</button></div><div class="strip">${DAILY.map(d => `<div>${d}</div>`).join('')}</div><div class="stage"></div></section>`;
  const stage = view.querySelector('.stage'), strip = view.querySelectorAll('.strip div');
  view.querySelector('[data-act="exit"]').onclick = () => go('home');
  const day = Store.day();
  function frame(title, sub) {
    strip.forEach((d, i) => { d.classList.toggle('on', i === s); d.classList.toggle('past', i < s); });
    stage.innerHTML = `<div class="tag">${DAILY[s]} · ${s + 1} of 6</div><h2>${title}</h2>${sub ? `<p class="lead">${sub}</p>` : ''}<div class="task"></div><div class="stepnav"><button type="button" class="skip" data-act="skip">Skip</button><button type="button" class="btn primary" data-act="next" disabled>Next</button></div>`;
    const next = stage.querySelector('[data-act="next"]');
    const advance = () => { runCleanup(); s++; steps[s](); };
    next.onclick = advance; stage.querySelector('[data-act="skip"]').onclick = advance;
    return { body: stage.querySelector('.task'), ready: () => { next.disabled = false; } };
  }
  const steps = [
    function tune() {
      const f = frame('Match three notes', 'Listen, then play or sing the same note. Any octave counts.');
      const zone = Store.data.range;
      const lo = zone ? Math.max(48, zone.zl) : 55, hi = zone ? Math.min(72, zone.zh) : 67;
      let r = 0, target = randInt(lo, hi), tries = 0;
      f.body.innerHTML = `<div class="row">${playBtn('Hear it again')}<div class="progress-dots"><span></span><span></span><span></span></div></div><p class="fb info" aria-live="polite">Listening…</p>`;
      const fbEl = f.body.querySelector('.fb'), dots = f.body.querySelectorAll('.progress-dots span');
      const play = () => Sound.tone(target, Sound.now() + 0.05, 1);
      f.body.querySelector('[data-act="play"]').onclick = play;
      setTimeout(play, 250);
      cleanup = Bus.on('note', d => {
        if (r >= 3) return;
        tries++;
        if (mod12(d.midi) === mod12(target)) {
          dots[r].classList.add('on'); r++; if (tries === 1) day.tuneOk++; day.tuneN++; tries = 0;
          fb(fbEl, 'good', `${pcLabel(mod12(target))}. Matched.`);
          if (r >= 3) { Store.save(); f.ready(); } else { target = randInt(lo, hi); setTimeout(play, 900); }
        } else fb(fbEl, 'bad', `That is ${noteName(d.midi)}. ${d.midi < target ? 'Go higher.' : 'Go lower.'}`);
      });
    },
    function review() {
      let due = dueCards();
      const practice = !due.length;
      const unlocked = allCardDefs().filter(c => Store.data.cards[c.id]);
      if (practice) due = shuffle(unlocked).slice(0, 3);
      due = shuffle(due).slice(0, 8);
      const f = frame(practice ? (unlocked.length ? 'Nothing due: a quick warm-up' : 'Your review deck is empty') : `${due.length} card${due.length > 1 ? 's' : ''} due`, unlocked.length ? 'Answer by playing, singing or choosing. Speed counts toward mastery.' : 'Cards join the deck as you finish units. The first lesson adds the first card.');
      if (!due.length) { f.ready(); return; }
      let k = 0;
      const holder = document.createElement('div'); f.body.appendChild(holder);
      const counter = document.createElement('p'); counter.className = 'eyebrow'; f.body.prepend(counter);
      function show() {
        runCleanup();
        if (k >= due.length) { counter.textContent = 'Deck done'; holder.innerHTML = '<p class="fb good">All cards answered. The scheduler has moved each one to its next date.</p>'; Store.save(); f.ready(); return; }
        counter.textContent = `Card ${k + 1} of ${due.length}`;
        const c = due[k], t0 = performance.now();
        const fin = ok => { if (!practice) gradeCard(c.id, ok, performance.now() - t0); k++; setTimeout(show, ok ? 900 : 1900); };
        cleanup = CARD_TYPES[c.type](holder, c, fin);
      }
      show();
    },
    function newBite() {
      const nx = nextUnit();
      const f = frame(nx ? (nx.boss ? `Level ${nx.level} boss challenge` : `Up next: ${nx.title}`) : 'Every level complete', nx ? nx.blurb : 'You have finished every beginner unit. Your review deck keeps the skills sharp.');
      if (!nx) { f.ready(); return; }
      f.body.innerHTML = `<button type="button" class="btn primary" data-act="open">Start ${nx.boss ? 'the boss challenge' : nx.create ? nx.title : 'unit ' + nx.id}</button>`;
      f.body.querySelector('[data-act="open"]').onclick = () => {
        const host = document.createElement('div'); f.body.innerHTML = ''; f.body.appendChild(host);
        runLesson(nx, host, unit => { host.innerHTML = `<p class="fb good">${unit.title}: done. ${(CARD_DEFS[unit.id] || []).length ? 'New review cards joined your deck.' : ''}</p>`; f.ready(); }, () => { host.innerHTML = `<p class="fb info">Lesson paused. You can pick it up from the Level ${nx.level} path.</p>`; f.ready(); });
      };
    },
    function create() {
      const lv = levelByN(currentLevel()), cr = lv.create || levelByN(1).create;
      const f = frame('Make something', 'Two minutes, one small constraint. Everything you save goes in your sketchbook.');
      cleanup = Tasks[cr.task || 'motif'](f.body, Object.assign({ prompt: rand(cr.prompts), level: lv.n }, cr.params), () => f.ready());
    },
    function ear() {
      let n = currentLevel(); while (n > 1 && !(levelByN(n) && levelByN(n).ear)) n--;
      const e = levelByN(n).ear;
      const f = frame(e.title, e.sub);
      cleanup = e.run(f.body, (ok, total) => { day.earOk += ok; day.earN += total; Store.save(); f.ready(); });
    },
    function onePercent() {
      day.done = true; bumpStreak(); Store.save(); paintStreak();
      const f = frame('Today’s 1%', '');
      const msg = onePercentMessage();
      f.body.innerHTML = `<div class="one-percent">${msg.big}</div><p>${msg.small}</p><p class="eyebrow" style="margin-top:12px">${Store.data.streak.count} day streak · ${dueCards().length} cards due now</p>`;
      const nb = stage.querySelector('[data-act="next"]'); nb.disabled = false; nb.textContent = 'Done'; nb.onclick = () => go('home');
      stage.querySelector('[data-act="skip"]').hidden = true;

}
function onePercentMessage() {
  const h = Store.data.history, t = todayStr();
  const today = h[t];
  const prevDays = Object.keys(h).filter(d => d < t).sort();
  const prev = prevDays.length ? h[prevDays[prevDays.length - 1]] : null;
  const speed = x => x && x.revMs && x.revMs.length ? mean(x.revMs) / 1000 : null;
  const acc = (o, n) => n ? o / n : null;
  if (today && today.wins && today.wins.length) return today.wins[today.wins.length - 1];
  if (prev) {
    const s0 = speed(prev), s1 = speed(today);
    if (s0 && s1 && s1 < s0) return { big: `${s0.toFixed(1)} s → ${s1.toFixed(1)} s`, small: 'Average time per review card, last session vs today. Faster recall is what mastery looks like.' };
    const e0 = acc(prev.earOk, prev.earN), e1 = acc(today.earOk, today.earN);
    if (e0 != null && e1 != null && e1 > e0) return { big: `${Math.round(e0 * 100)}% → ${Math.round(e1 * 100)}%`, small: 'Ear spark accuracy, last session vs today.' };
    const u0 = acc(prev.tuneOk, prev.tuneN), u1 = acc(today.tuneOk, today.tuneN);
    if (u0 != null && u1 != null && u1 > u0) return { big: `${Math.round(u0 * 100)}% → ${Math.round(u1 * 100)}%`, small: 'Notes matched on the first try, last session vs today.' };
    return { big: 'Steady', small: 'No number beat last time today, and that is normal. Spaced practice dips before it climbs.' };
  }
  const s1 = speed(today);
  return { big: s1 ? `${s1.toFixed(1)} s per card` : 'Day one', small: s1 ? 'Your first review speed. Tomorrow’s Daily Set compares against it.' : 'Your first Daily Set is done. From tomorrow, this step shows one number that improved.' };
}

function cardPlay(el, c, fin) {

}
function landmarkHint(pc) {
  return { 0: 'just left of the two black keys', 2: 'between the two black keys', 4: 'just right of the two black keys', 5: 'just left of the three black keys', 7: 'between the first and second of the three', 9: 'between the second and third of the three', 11: 'just right of the three black keys', 1: 'the first of the two black keys', 3: 'the second of the two black keys', 6: 'the first of the three black keys', 8: 'the middle of the three black keys', 10: 'the last of the three black keys' }[pc];
}
function cardStep(el, c, fin) {

  const f = el.querySelector('.fb'); let done = false; const want = c.start + c.dir * c.size;
  const off = Bus.on('note', d => { if (done || d.midi === c.start) return; done = true; const ok = mod12(d.midi) === mod12(want); fb(f, ok ? 'good' : 'bad', ok ? `${pcLabel(mod12(want))}. Right.` : `The answer is ${pcLabel(mod12(want))}.`); fin(ok); });
  return () => { off(); Keyboard.clearMarks(); };
}
function cardBlack(el, c, fin) {
  Keyboard.mark(60 + c.pc, 'target');
  const opts = shuffle([SHARP[c.pc], FLAT[c.pc], ...shuffle(BLACK_PCS.filter(x => x !== c.pc)).slice(0, 1).reduce((a, x) => a.concat([SHARP[x], FLAT[x]]), [])]);
  el.innerHTML = `<p class="prompt">Name the glowing key. Pick both names.</p><div class="choices">${opts.map(o => `<button type="button" class="choice" aria-pressed="false" data-v="${o}">${o}</button>`).join('')}</div><p class="fb info" aria-live="polite"></p>`;

  function paintKey() {
    const now = performance.now();

    if (pcs.length < 4) { box.innerHTML = 'Play at least four different notes and Motif will suggest the key they fit.'; return; }
    const fits = Theory.CIRCLE.map((k, i) => ({ k, i, n: pcs.filter(p => Theory.scale(k).map(Theory.pc).indexOf(p) >= 0).length }));
    const best = Math.max.apply(null, fits.map(f => f.n));

    box.innerHTML = best === pcs.length
      ? `These notes fit <b>${keys.map(f => f.k + ' major / ' + Theory.CIRCLE_MINOR[f.i] + ' minor').join('</b>, or <b>')}</b>.`
      : `Closest: <b>${keys.map(f => f.k + ' major').join('</b> or <b>')}</b> (${best} of ${pcs.length} notes fit).`;

      $('[data-chord-notes]').textContent = (ev.q ? Theory.CHORDS[ev.q].name + ' · ' : '') + ev.pcs.map(p => Theory.pcName(p)).join(' ');
      if (ev.sym) { trail.push({ label: Theory.pretty(ev.sym), chord: true }); ev.pcs.forEach(pc => heard.push({ pc, t: performance.now() })); paintTrail(); paintKey(); }

}

  let pos = 0, ring = 'major';
  const circle = Circle.mount(el.querySelector('.circle-host'), { selected: 0, family: true }, (p, r) => { pos = p; ring = r; paint(true); });
  function paint(play) {
    const minor = ring === 'minor';
    const tonic = minor ? Theory.CIRCLE_MINOR[pos] : Theory.CIRCLE[pos];
    const sig = Theory.keySig(tonic, minor ? 'minor' : 'major');
    const alt = Theory.CIRCLE_ALT[pos];
    const scale = Theory.scale(Theory.withOct(tonic, 4), minor ? 'minor' : 'major', true);
    const chords = Theory.diatonic(tonic, minor ? 'minor' : 'major');
    const n = sig.n;
    circle.update({ selected: pos, family: true, center: minor ? [tonic + ' minor', Circle.sigText(pos), 'relative: ' + sig.major] : [tonic + ' major', Circle.sigText(pos), 'relative: ' + sig.minor + 'm'] });
    info.innerHTML = `<h2>${tonic} ${minor ? 'minor' : 'major'}${alt ? ` <span class="muted small">(also written ${minor ? alt.minor + ' minor' : alt.major + ' major'})</span>` : ''}</h2>
      <p>${n === 0 ? 'No sharps or flats.' : `${Math.abs(n)} ${n > 0 ? 'sharp' : 'flat'}${Math.abs(n) > 1 ? 's' : ''}: ${sig.acc.join(' ')}.`} ${minor ? `Relative major: <b>${sig.major} major</b> (up 3 half steps).` : `Relative minor: <b>${sig.minor} minor</b> (down 3 half steps).`}</p>
      <div class="art">${Staff.svg({ clef: 'treble', keySig: n, notes: scale.map(x => ({ n: x, acc: false })), gap: 30 })}</div>
      <div class="row"><button type="button" class="btn small" data-act="scale">▶ Scale</button></div>
      <div class="eyebrow" style="margin-top:12px">Chords in this key</div>
      <div class="chord-row">${chords.map((c, i) => `<button type="button" class="chord-btn" data-i="${i}"><span class="mono">${c.roman}</span><b>${Theory.pretty(c.sym)}</b></button>`).join('')}</div>
      <p class="muted small">The lit slice of the circle holds the six main chords: three majors outside, three minors inside.${minor ? ' In minor keys the V is often made major (from harmonic minor) for a stronger pull home.' : ' The diminished vii° sits outside the slice.'}</p>`;
    Keyboard.clearMarks(); Keyboard.markPcs(scale.map(Theory.pc), 'hint');
    const playScale = () => Sound.seq(scale.map((x, i) => ({ m: Theory.midi(x), t: i * 0.28, d: 0.3 })));
    info.querySelector('[data-act="scale"]').onclick = playScale;
    info.querySelectorAll('.chord-btn').forEach(b => { b.onclick = () => { const c = chords[+b.dataset.i]; Sound.chord(Theory.voicing(c.root, c.q, 4)); Keyboard.clearMarks(); Keyboard.markPcs(c.notes.map(Theory.pc), 'hint'); }; });
    if (play) playScale();
  }
  paint(false);
  return () => { circle.destroy(); Keyboard.clearMarks(); };
}

/* ---------- Scale finder ---------- */
function toolScales(el) {
  const st = Store.data.settings;
  let root = st.toolScaleRoot || 'C', type = st.toolScaleType || 'major';
  el.innerHTML = `<div class="row tool-controls">${selectHTML('sc-root', 'Root', SPELLED_ROOTS.map(r => [r, r]), root)}${selectHTML('sc-type', 'Scale', Object.keys(Theory.SCALES).map(k => [k, Theory.SCALES[k].name]), type)}</div><div class="tool-out"></div><div class="try"></div>`;
  const out = el.querySelector('.tool-out'), tryEl = el.querySelector('.try');
  let inner = null;
  function paint() {
    if (inner) { inner(); inner = null; } tryEl.innerHTML = '';
    st.toolScaleRoot = root; st.toolScaleType = type; Store.save();
    const notes = Theory.scale(Theory.withOct(root, 4), type, true);
    const rec = Theory.recipe(type);
    const degs = Theory.SCALES[type].degrees.map(d => d.replace(/b/g, '♭').replace(/#/g, '♯'));
    out.innerHTML = `<h2>${root} ${Theory.SCALES[type].name}</h2>${noteChips(notes)}
      <table class="tbl"><tr><th>Steps</th><td class="mono">${rec.map(Theory.stepName).join(' ')} <span class="muted">(${rec.join('-')} half steps)</span></td></tr><tr><th>Degrees</th><td class="mono">${degs.join(' ')}</td></tr></table>
      <div class="art">${Staff.svg({ clef: 'treble', notes, gap: 34 })}</div>
      <div class="hook">${SCALE_HOOKS[type]}</div>
      <div class="row"><button type="button" class="btn small" data-act="play">▶ Play</button><button type="button" class="btn small primary" data-act="try">Play it yourself</button></div>`;
    Keyboard.clearMarks(); Keyboard.markPcs(notes.map(Theory.pc), 'hint');
    out.querySelector('[data-act="play"]').onclick = () => Sound.seq(notes.map((n, i) => ({ m: Theory.midi(n), t: i * 0.3, d: 0.32 })));
    out.querySelector('[data-act="try"]').onclick = () => { if (inner) inner(); inner = Tasks.playSeq(tryEl, { prompt: `Play ${root} ${Theory.SCALES[type].name}, bottom to top.`, notes, steps: true, endText: 'All the way up. Now try it without looking.' }, () => {}); };
  }
  el.querySelector('#sc-root').onchange = e => { root = e.target.value; paint(); };
  el.querySelector('#sc-type').onchange = e => { type = e.target.value; paint(); };
  paint();
  return () => { if (inner) inner(); Keyboard.clearMarks(); };
}

/* ---------- Chord finder ---------- */
function toolChords(el) {
  const st = Store.data.settings;
  let root = st.toolChordRoot || 'C', q = st.toolChordQ || 'maj', inv = 0;
  el.innerHTML = `<div class="row tool-controls">${selectHTML('ch-root', 'Root', SPELLED_ROOTS.map(r => [r, r]), root)}${selectHTML('ch-q', 'Quality', Object.keys(Theory.CHORDS).map(k => [k, Theory.CHORDS[k].name]), q)}</div><div class="tool-out"></div><div class="try"></div>`;
  const out = el.querySelector('.tool-out'), tryEl = el.querySelector('.try');
  let inner = null;
  function paint() {
    if (inner) { inner(); inner = null; } tryEl.innerHTML = '';
    st.toolChordRoot = root; st.toolChordQ = q; Store.save();
    const C = Theory.CHORDS[q], notes = Theory.chordNotes(root, q);
    if (inv >= notes.length) inv = 0;
    const ms = Theory.voicing(root, q, 4, inv);
    /* spell each voiced MIDI note with its chord letter: midi = (octave + 1) × 12 + letter + accidental */
    const staffNotes = ms.map((m, i) => { const n = notes[(i + inv) % notes.length], pn = Theory.parse(n); return Theory.withOct(n, (m - Theory.NAT[pn.L] - pn.acc) / 12 - 1); });
    const bass = inv ? notes[inv] : null;
    const invNames = ['root position', 'first inversion', 'second inversion', 'third inversion'];
    out.innerHTML = `<h2>${Theory.pretty(Theory.symbol(root, q, bass))} <span class="muted small">${root} ${C.name}${inv ? ', ' + invNames[inv] : ''}</span></h2>${noteChips(notes)}
      <table class="tbl"><tr><th>Recipe</th><td class="mono">${C.recipe} half steps</td></tr><tr><th>Degrees</th><td class="mono">${C.degrees.map(d => d.replace(/bb/g, '𝄫').replace(/b/g, '♭').replace(/#/g, '♯')).join(' ')}</td></tr></table>
      <div class="art">${Staff.svg({ clef: 'treble', notes: [staffNotes] })}</div>
      <div class="hook">${CHORD_HOOKS[q]}</div>
      <div class="row">${notes.map((n, i) => `<button type="button" class="btn small${i === inv ? ' primary' : ''}" data-inv="${i}">${i ? n + ' in the bass' : 'Root position'}</button>`).join('')}</div>
      <div class="row"><button type="button" class="btn small" data-act="play">▶ Play</button><button type="button" class="btn small" data-act="arp">▶ One at a time</button><button type="button" class="btn small primary" data-act="try">Play it yourself</button></div>`;
    Keyboard.clearMarks(); ms.forEach(m => Keyboard.mark(m, 'hint'));
    out.querySelector('[data-act="play"]').onclick = () => Sound.chord(ms);
    out.querySelector('[data-act="arp"]').onclick = () => Sound.seq(ms.map((m, i) => ({ m, t: i * 0.35, d: 0.6 })));
    out.querySelectorAll('[data-inv]').forEach(b => { b.onclick = () => { inv = +b.dataset.inv; paint(); Sound.chord(Theory.voicing(root, q, 4, inv)); }; });
    out.querySelector('[data-act="try"]').onclick = () => { if (inner) inner(); inner = Tasks.playChords(tryEl, { prompt: 'Play it on any instrument. With the mic on, Motif listens.', chords: [Theory.symbol(root, q, bass)], tones: true }, () => {}); };
  }
  el.querySelector('#ch-root').onchange = e => { root = e.target.value; inv = 0; paint(); };
  el.querySelector('#ch-q').onchange = e => { q = e.target.value; inv = 0; paint(); };
  paint();
  return () => { if (inner) inner(); Keyboard.clearMarks(); };
}

/* ---------- Progression player ---------- */
function toolProgressions(el) {
  const st = Store.data.settings;
  let pid = st.toolProg || 'pop', key = st.toolProgKey || 'C', bpm = 90;
  el.innerHTML = `<div class="row tool-controls">${selectHTML('pr-id', 'Progression', Theory.PROGRESSIONS.map(p => [p.id, p.name]), pid)}${selectHTML('pr-key', 'Key', Theory.MAJOR_KEYS.slice(0, 12).map(k => [k, k]), key)}<label class="sel" for="pr-bpm"><span>Tempo</span><input id="pr-bpm" type="range" min="50" max="140" step="5" value="${bpm}"></label></div><div class="tool-out"></div><div class="try"></div>`;
  const out = el.querySelector('.tool-out'), tryEl = el.querySelector('.try');
  let inner = null, timers = [];
  const stop = () => { timers.forEach(clearTimeout); timers = []; out.querySelectorAll('.prog-chord').forEach(c => c.classList.remove('on')); Keyboard.clearMarks(); };
  function paint() {
    stop(); if (inner) { inner(); inner = null; } tryEl.innerHTML = '';
    st.toolProg = pid; st.toolProgKey = key; Store.save();
    const P = Theory.PROGRESSIONS.find(p => p.id === pid);
    const tonic = P.mode === 'minor' ? Theory.relMinor(key) : key;
    const chords = Theory.progression(P.romans, tonic, P.mode);
    out.innerHTML = `<h2>${P.name} <span class="muted small">in ${Theory.keyName(tonic, P.mode)}</span></h2>
      <div class="prog">${chords.map((c, i) => `<div class="prog-chord" data-i="${i}"><span class="mono">${c.roman}</span><b>${Theory.pretty(c.sym)}</b></div>`).join('')}</div>
      <p class="muted">Heard in: ${P.songs.join(', ')}.</p>
      <div class="hook">Keep the numbers, change the key: pick another key above and the same numbers give new chord names.</div>
      <div class="row"><button type="button" class="btn small" data-act="play">▶ Play</button><button type="button" class="btn small" data-act="stop">■ Stop</button><button type="button" class="btn small primary" data-act="try">Play it yourself</button></div>`;
    out.querySelector('[data-act="play"]').onclick = () => {
      stop();
      const beat = 60 / bpm, bar = beat * (P.id === 'blues' ? 4 : 2);
      playChordList(chords.map((c, i) => ({ sym: c.sym, t: i * bar, d: bar * 0.95 })));
      chords.forEach((c, i) => timers.push(setTimeout(() => {
        out.querySelectorAll('.prog-chord').forEach((x, k) => x.classList.toggle('on', k === i));
        Keyboard.clearMarks(); Keyboard.markPcs(c.notes.map(Theory.pc), 'hint');
      }, (0.08 + i * bar) * 1000)));
      timers.push(setTimeout(stop, (0.08 + chords.length * bar) * 1000));
    };
    out.querySelector('[data-act="stop"]').onclick = stop;
    out.querySelector('[data-act="try"]').onclick = () => { stop(); if (inner) inner(); inner = Tasks.playChords(tryEl, { prompt: 'Play each chord in turn. Tap the notes together, use MIDI, or play into the mic.', chords: chords.map(c => c.sym), labels: chords.map(c => `${c.roman} · ${Theory.pretty(c.sym)}`), tones: true }, () => {}); };
  }
  el.querySelector('#pr-id').onchange = e => { pid = e.target.value; paint(); };
  el.querySelector('#pr-key').onchange = e => { key = e.target.value; paint(); };
  el.querySelector('#pr-bpm').oninput = e => { bpm = +e.target.value; };
  paint();
  return () => { stop(); if (inner) inner(); };
}

/* ---------- Memory hooks ---------- */
function toolHooks(el) {
  const reached = currentLevel();
  el.innerHTML = `<p class="lead">Every recipe, saying and song anchor from the course. Hooks from levels you have not reached yet are shown faded; peek if you like.</p>
    <div class="hooks">${LEVELS.map(l => `<section class="hook-group${l.n > reached ? ' later' : ''}"><h3><span class="mono">Level ${l.n}</span> ${l.title}</h3>${HOOKS.filter(h => h[0] === l.n).map(h => `<div class="hook"><b>${h[1]}.</b> ${h[2]}</div>`).join('')}</section>`).join('')}</div>`;
}

/* =================================================================
   Boot
   ================================================================= */
function boot() {
  Store.load();
  Keyboard.mount(document.getElementById('kb'));
  mountReadout(document.getElementById('readout'));
  paintStreak();
  document.querySelectorAll('.nav button').forEach(b => { b.onclick = () => go(b.dataset.view); });
  document.getElementById('brand').onclick = () => go('home');
  const dock = document.querySelector('.dock');
  const setDock = () => document.documentElement.style.setProperty('--dock-h', dock.offsetHeight + 'px');
  setDock();
  if (window.ResizeObserver) new ResizeObserver(setDock).observe(dock);
  if (!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia && window.isSecureContext)) Mic.set('unsupported');
  go('home');
}
/* a handle for tests and the browser console */
window.Motif = { Theory, Tasks, Staff, Circle, ChordIn, Store, Bus, Sound, Keyboard, LEVELS, CARD_DEFS, CARD_TYPES, go, chordTarget, chordHit };
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
})();

</script>
