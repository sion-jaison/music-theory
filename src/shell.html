<title>Motif</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=JetBrains+Mono:wght@500;700&family=Noto+Music&display=swap">
<style>
/*STYLES*/
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(var(--dock-h) + 16px); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 10px; z-index: 40; width: max-content; max-width: min(92vw, 520px); font-size: 14px; font-weight: 700; }
</style>

<header class="top">
  <div class="top-in">
    <button type="button" class="brand" id="brand" aria-label="Motif home">
      <svg viewBox="0 0 32 32" aria-hidden="true"><line x1="3" y1="23" x2="29" y2="23" stroke="var(--line)" stroke-width="1.5"/><line x1="3" y1="17" x2="29" y2="17" stroke="var(--line)" stroke-width="1.5"/><line x1="3" y1="11" x2="29" y2="11" stroke="var(--line)" stroke-width="1.5"/><ellipse cx="11" cy="23" rx="5" ry="3.6" transform="rotate(-20 11 23)" fill="var(--accent)"/><line x1="15.4" y1="22" x2="15.4" y2="6" stroke="var(--accent)" stroke-width="2"/><ellipse cx="22" cy="14" rx="4" ry="3" transform="rotate(-20 22 14)" fill="var(--glow)"/></svg>
      Motif
    </button>
    <span class="streak" id="streak"></span>
    <nav class="nav" aria-label="Sections">
      <button type="button" data-view="home">Home</button>
      <button type="button" data-view="toolbox">Toolbox</button>
      <button type="button" data-view="sketchbook">Sketchbook</button>
      <button type="button" data-view="setup">Sound setup</button>
    </nav>
  </div>
</header>

<main id="view" aria-live="off"></main>

<div class="toast" id="toast" role="status" hidden></div>

<section class="dock" aria-label="Instrument">
  <div class="dock-in">
    <div class="readout" id="readout">
      <span class="heard" aria-live="polite" title="Last note heard or played">–</span>
      <span class="cents" hidden><i></i></span>
      <span class="hint"></span>
      <button type="button" class="mic-pill"><span class="lvl"><i></i></span><span class="txt">Turn on mic</span></button>
    </div>
    <div class="kb" id="kb" aria-label="On-screen keyboard, C3 to C5"></div>
  </div>
</section>

/*PITCH*/
</script>
<script>
